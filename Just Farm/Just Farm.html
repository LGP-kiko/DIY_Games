      <div class="panel-h"><h2>农场</h2><div class="hint">进农场后当天不能外出</div></div>
      <div class="season-pick"><span class="sp-h">眼下是<b>${season()}</b>季 · 当季推荐</span>${seasonPicks().map(c =>
        `<button class="seedchip ${UI.seed === c.id ? 'on' : ''}" data-act="seedpick" data-v="${c.id}" title="${attr(E.tipOf(c.id))}" data-tip="${attr(E.tipOf(c.id))}">${c.n}<i>${c.days} 天</i></button>`).join('')}
        ${S.plots.some(p => !p.crop) ? `<button class="seedchip all" data-act="plantall">全部种植 ¥${S.plots.filter(p => !p.crop).length * E.seedCost(UI.seed)}</button>` : ''}</div>
      <div class="plots">${cards}</div>
      <div class="sub-h fac-head"><span>农场设施</span><button class="fac-toggle" data-act="factoggle" title="展开/收起">${UI.facOpen ? '−' : '+'}</button></div>
      ${UI.facOpen ? `<div class="facs">${D.FACILITIES.map(f => {
        const maxPlots = E.hasTalent('TL-23') ? 8 : 6;
        const built = f.id === 'U-01' ? S.plots.length >= maxPlots : !!(S.fac || {})[f.id];
        const lack = f.need.filter(n => E.countAll(n[0]) < n[1]);
        const needTxt = f.need.length
          ? f.need.map(n => `<span class="${E.countAll(n[0]) >= n[1] ? 'ok' : 'down'}" title="${attr(E.tipOf(n[0]))}" data-tip="${attr(E.tipOf(n[0]))}">${E.nameOf(n[0])} ${E.countAll(n[0])}/${n[1]}</span>`).join(' + ')
          : '';
        const facN = f.id === 'U-01'
          ? `<span class="${built ? 'ok' : 'dim'}">田地 ${S.plots.length}/${maxPlots}</span>${built ? '' : ' · ' + needTxt}`
          : (built ? '<span class="ok">已建成</span>' : (f.reserved ? '<span class="dim">未开放</span>' : needTxt));
        return `<div class="fac ${built ? 'built' : ''} ${f.reserved ? 'off' : ''}">
          <div class="fac-h"><b>${f.n}</b><span class="dim">${f.id}</span></div>
          <div class="fac-d">${f.desc}</div>
          <div class="fac-n">${facN}</div>
          ${built || f.reserved ? '' : `<button class="mini" data-act="build" data-v="${f.id}" ${lack.length ? 'disabled' : ''}>${f.id === 'U-01' ? '开垦' : '建造'}</button>`}
        </div>`;
      }).join('')}</div>` : ''}
      <div class="note">作物每天都会消耗肥力，生长周期水份需求是固定的。</div>
    </section>`;
  }

  /* ---------------- 外出 ---------------- */
  function viewRaid() {
    const S = E.S;
    if (!S.raid) {
      const maps = D.MAPS.map(m => {
        let err = E.mapReady(m.id);
        if (err && m.req && E.countAll(m.req) > 0 && S.stamina >= m.stam * 2) {
          const carried = E.countInv(m.req) > 0;
          const free = E.mod().bag - E.slotsUsed();
          if (carried || free >= E.sz(m.req)) err = null;
        }
        const loot = D.MATS.filter(x => x.maps.includes(m.n)).slice(0, 3).map(x => x.n).join('、');
        return `<button class="map ${err ? 'off' : ''}" data-act="start" data-v="${m.id}">
          <div class="map-h"><b>${m.n}</b><span class="dim">${m.stam * 2} 体力</span></div>
          <div class="map-b">${'◆'.repeat(m.risk + 1)}${'◇'.repeat(4 - m.risk)}
          ${m.presence ? '<span class="warn">· 偷窃计入存在感</span>' : ''}</div>
          <div class="map-loot">${loot}</div>
          ${m.req ? `<div class="map-req ${E.countAll(m.req) ? 'ok' : 'down'}">需要：${E.nameOf(m.req)}${E.countAll(m.req) ? ' ✓' : ' ✗'}</div>` : ''}
        </button>`;
      }).join('');
      return `<section class="panel"><div class="panel-h"><h2>出门</h2>
        <div class="hint">外出后当天不能回农场</div></div>
        <div class="maps">${maps}</div></section>`;
    }
    const r = S.raid, map = D.MAPS.find(m => m.id === r.mapId) || { n: '外面' };
    const atBottom = r.node >= r.nodes;
    const escapeTal = E.hasTalent('TL-22');
    const canExit = atBottom || escapeTal;
    const pctDone = Math.round((r.node - 1) / Math.max(1, r.nodes - 1) * 100);
    return `<section class="panel"><div class="panel-h"><h2>${map.n}</h2>
      <div class="hint">已翻 ${r.searched} 个容器 · 体力 ${n1(S.stamina)} · SAN ${n1(S.san)}</div></div>
      <div class="depth"><i style="width:${pctDone}%"></i></div>
      <div class="raid-actions">
        <button data-act="search">搜索容器</button>
        <button data-act="advance" ${atBottom ? 'disabled' : ''}>往里走</button>
        <button data-act="extract" class="primary" ${canExit ? '' : 'disabled'}>${atBottom ? '从这里回去' : (escapeTal ? '提前回去' : '还没走到底')}</button>
      </div>
      <div class="row-actions">
        <button class="mini" data-act="abort">原路折返（丢掉这趟的东西）</button>
      </div>
    </section>`;
  }

  /* ---------------- 特殊场景 ---------------- */
  function viewDetained() {
    const S = E.S;
    return `<section class="panel"><div class="panel-h"><h2>拘留所</h2>
      <div class="hint">还剩 ${S.detained} 天 · 本期周供豁免</div></div>
      <div class="note">监室里只有一张床。除了等，什么也做不了。</div>
    </section>`;
  }

  function viewHospital() {
    const S = E.S;
    const h = S.hospital;
    const first = h.stage === 1;
    const rest = !first && !!h.rest;
    return `<section class="panel"><div class="panel-h"><h2>${first ? '诊所 · 昏迷' : (rest ? '诊所 · 被按回病床' : '诊所 · 留院观察')}</h2>
      <div class="hint">诊费 ¥${h.fee} 待结</div></div>
      <div class="note">${first
        ? '体力见底，醒来时人在诊所。今天到此为止，只能等天亮。明天留院观察的一天，可以在诊所里翻点东西。'
        : rest
          ? '脸色太差，被值班医生抓了个正着，病床护栏都拉起来了：「今天不许再动。」只能等明天。'
          : '这一天留在诊所。病床柜与档案柜就在手边，想翻多久翻多久，只是费体力；翻得多了，还会有人记住你的脸。出院时结清诊费，钱不够就出不去。'}</div>
      ${first
        ? '<div class="row-actions"><button class="primary" data-act="endday">下一天 ›</button></div>'
        : `<div class="raid-actions">
        ${rest ? '' : '<button data-act="hsearch">搜病床柜 / 档案柜</button>'}
        <button class="primary" data-act="endday">出院（结账）</button>
      </div>`}
    </section>`;
  }

  /* ---------------- 市场 ---------------- */
  function viewMarket() {
    const S = E.S;
    const rows = D.CONTRACTS.map(c => {
      const px = S.prices[c.id], pv = S.prev[c.id];
      const chg = (px / pv - 1);
      const held = S.positions.filter(p => p.cid === c.id);
      return `<tr class="${UI.sel === c.id ? 'sel' : ''}" data-act="selc" data-v="${c.id}">
        <td class="dim">${c.id}</td><td>${c.n}</td><td class="dim">${c.cat}</td>
        <td class="num">${px3(px)}</td>
        <td class="num ${chg >= 0 ? 'up' : 'down'}">${pct(chg)}</td>
        <td class="num">${held.length ? '●' + held[0].lev + '×' : ''}</td></tr>`;
    }).join('');
    const c = D.CONTRACTS.find(x => x.id === UI.sel);
    const px = S.prices[UI.sel];
    const min = S.diff.minOpen;
    const posRows = S.positions.map(p => {
      const cc = D.CONTRACTS.find(x => x.id === p.cid);
      const pnl = (S.prices[p.cid] - p.entry) * p.qty * p.dir;
      return `<tr><td>${cc.n}</td><td>${p.dir > 0 ? '多' : '空'}</td><td class="num">${p.lev}×</td>
        <td class="num">${money(p.margin)}</td><td class="num">${px3(p.entry)}</td>
        <td class="num">${p.liq ? px3(p.liq) : '—'}</td>
        <td class="num ${pnl >= 0 ? 'up' : 'down'}">${pnl >= 0 ? '+' : ''}${money(pnl)}</td>
        <td><button class="mini" data-act="close" data-v="${p.pid}">平仓</button>
        <button class="mini" data-act="addmargin" data-v="${p.pid}">加保</button>
        ${E.canDeliver(p) ? `<button class="mini" data-act="deliver" data-v="${p.pid}">交割</button>` : ''}</td></tr>`;
    }).join('');
    const levDrop = (1 / UI.lev) * (1 - S.diff.keep) * E.mod().liqBuffer;
    const liq = UI.dir > 0 ? px * (1 - levDrop) : px * (1 + levDrop);
    const feeEst = Math.max(0, Math.round(UI.margin * UI.lev * E.mod().fee));
    const openLabel = UI.margin < min ? `下单（门槛 ¥${money(min)}）` : `下单（手续费 ¥${money(feeEst)}）`;
    const mkt = D.CONTRACTS.reduce((a, c) => a + S.prices[c.id] / S.prev[c.id], 0) / D.CONTRACTS.length - 1;
    return `<section class="panel wide"><div class="panel-h"><h2>交易所</h2>
      <div class="hint">今日大盘 <b class="${mkt >= 0 ? 'up' : 'down'}">${pct(mkt)}</b></div></div>
      <div class="market">
        <div class="quotes"><table class="grid">
          <thead><tr><th>编号</th><th>品种</th><th>类别</th><th class="num">最新</th><th class="num">涨跌</th><th class="num">仓</th></tr></thead>
          <tbody>${rows}</tbody></table></div>
        <div class="ticket">
          <div class="ticket-h"><b>${c.n}</b><span class="dim">${c.id} · σ ${(c.sig * 100).toFixed(1)}%</span></div>
          <div class="ticket-px">现价 <b>${px3(px)}</b></div>
          <div class="seg">
            <button class="${UI.dir > 0 ? 'on long' : ''}" data-act="dir" data-v="1">做多</button>
            <button class="${UI.dir < 0 ? 'on short' : ''}" data-act="dir" data-v="-1">做空</button>
          </div>
          <label class="field"><span>保证金</span><input id="margin" type="number" min="${min}" step="100" value="${UI.margin}" onfocus="this.select()"></label>
          <label class="field"><span>杠杆</span><input id="lev" type="range" min="0" max="18" step="1" value="${levIdx(UI.lev)}" oninput="UI.setLevIdx(this.value)"> <b id="levv" class="${UI.lev > 50 ? 'down' : ''}">${UI.lev}×</b></label>
          <div class="est">
            <div>名义仓位 <b>¥${money(UI.margin * UI.lev)}</b></div>
            <div>强平价 <b>${UI.lev <= 1 ? '不爆仓' : px3(liq)}</b>${UI.lev > 1 ? `（${(levDrop * 100).toFixed(2)}%）` : ''}</div>
            <div>手续费 <b>¥${money(feeEst)}</b> · 合计扣款 <b>¥${money(UI.margin + feeEst)}</b></div>
          </div>
          <button id="openbtn" class="primary" data-act="open">${openLabel}</button>
          <div class="note small">1× 不交保证金、永不爆仓。手续费 ${(E.mod().fee * 100).toFixed(2)}%，开平各一次。</div>
          <div class="sub-h">预设</div>
          <div class="chips">
            ${S.presets.map((p, i) => `<span class="pset"><button data-act="preset" data-v="${i}">${esc(p.n)}</button><i data-act="delpreset" data-v="${i}" title="删除">×</i></span>`).join('')}
            <button class="chip" data-act="savepreset">存为预设</button>
          </div>
        </div>
      </div>
      <div class="positions"><div class="sub-h">持仓</div>
        <table class="grid"><thead><tr><th>品种</th><th>方向</th><th class="num">杠杆</th><th class="num">保证金</th><th class="num">开仓</th><th class="num">强平</th><th class="num">浮盈亏</th><th></th></tr></thead>
        <tbody>${posRows || '<tr><td colspan="8" class="dim">空仓</td></tr>'}</tbody></table></div>
    </section>`;
  }

  /* ---------------- 制作 ---------------- */
  const DEMAND = [
    ['体力', 1, 5], ['SAN', 6, 10], ['负重', 11, 15], ['撤离', 16, 20],
    ['潜入', 21, 25], ['交易', 26, 29], ['风控', 30, 33], ['种植', 34, 38],
    ['仓储', 39, 42], ['债务', 43, 45], ['医疗', 46, 48], ['变现', 49, 50]
  ];
  function viewCraft() {
    const S = E.S;
    const cats = ['can'].concat(DEMAND.map(d => d[0]));
    const list = D.ITEMS.filter(it => {
      const n = parseInt(it.id.slice(2), 10);
      if (UI.craftFilter === 'can') return E.canCraft(it.id);
      if (UI.craftFilter === 'all') return true;
      const d = DEMAND.find(x => x[0] === UI.craftFilter);
      return n >= d[1] && n <= d[2];
    }).map(it => {
      const ok = E.canCraft(it.id) && E.atHome();
      const need = E.craftNeed(it.id).map(([id, q]) => {
        const have = E.owned(id);
        return `<span class="${have >= q ? 'ok' : 'down'}" title="${attr(E.tipOf(id))}" data-tip="${attr(E.tipOf(id))}">${E.nameOf(id)} ${have}/${q}</span>`;
      }).join(' + ');
      const owned = E.owned(it.id);
      return `<div class="card ${ok ? '' : 'off'}">
        <div class="card-h"><b title="${attr(E.tipOf(it.id))}" data-tip="${attr(E.tipOf(it.id))}">${it.n}</b><span class="dim">${it.id}</span></div>
        <div class="card-d">${it.desc}</div>
        <div class="card-r">${need}</div>
        <div class="card-b"><button data-act="craft" data-v="${it.id}" ${ok ? '' : 'disabled'}>制作</button>
        ${it.use && owned ? `<button class="mini" data-act="use" data-v="${it.id}">使用</button>` : ''}
        <span class="dim">${owned ? '已有 ' + owned : ''}</span></div></div>`;
    }).join('');
    return `<section class="panel wide"><div class="panel-h"><h2>制作</h2>
      ${E.atHome() ? '' : '<div class="hint">人不在家，做不了东西。</div>'}</div>
      <div class="chips">${cats.map(c => `<button class="chip ${UI.craftFilter === c ? 'on' : ''}" data-act="cfilter" data-v="${c}">${c === 'can' ? '可合成' : c}</button>`).join('')}</div>
      <div class="cards">${list || '<div class="rowempty">手上材料不够，暂时没有能做的。</div>'}</div></section>`;
  }

  /* ---------------- 背包 ---------------- */
  function viewBag() {
    const S = E.S;
    const home = E.atHome();
    const groups = { 作物: [], 物资: [], 制品: [] };
    Object.keys(S.inv).forEach(id => {
      const q = S.inv[id];
      if (!q) return;
      const hot = E.hotCount(id);
      const row = { id, q, hot, legal: q - hot, name: E.nameOf(id), val: Math.round(E.valueOf(id) * (id[0] === 'C' ? E.cropQuality(id) : 1)), qual: E.qualityOf(id) };
      if (id[0] === 'C') groups.作物.push(row);
      else if (id[0] === 'G') groups.物资.push(row);
      else groups.制品.push(row);
    });
    const block = (title, arr) => `<div class="bag-g"><div class="sub-h">${title} <span class="dim">${arr.length} 种</span></div>
      ${arr.map(r => `<div class="rowitem">
        <span class="ri-n" title="${attr(E.tipOf(r.id))}" data-tip="${attr(E.tipOf(r.id))}"><i class="qdot q${r.qual}"></i>${r.name}${E.sz(r.id) > 1 ? `<em class="hot">占 ${E.sz(r.id)} 格</em>` : ''}${r.hot ? `<em class="hot">赃×${r.hot}</em>` : ''}${r.id[0] === 'C' && E.cropQuality(r.id) < 0.999 ? `<em class="hot">品相 ${Math.round(E.cropQuality(r.id) * 100)}%</em>` : ''}</span>
        <span class="ri-q">×${r.q}</span>
        <span class="ri-v">¥${r.val}</span>
        <span class="ri-a">
          ${r.id[0] === 'I' ? '<span class="dim" title="关键道具：不能卖，也不能销毁" data-tip="关键道具：不能卖，也不能销毁">关键道具</span>' : `${home ? `<button class="mini" data-act="sell" data-v="${r.id}" ${r.legal <= 0 ? 'disabled' : ''}>卖 1</button>
          ${r.legal > 1 ? `<button class="mini" data-act="sellall" data-v="${r.id}">全卖</button>` : ''}` : ''}
          ${D.ITEMS.find(x => x.id === r.id && x.use) ? `<button class="mini" data-act="use" data-v="${r.id}">使用</button>` : ''}
          <button class="mini" data-act="drop" data-v="${r.id}">扔掉</button>`}
        </span></div>`).join('') || '<div class="rowempty">空</div>'}</div>`;
    return `<section class="panel"><div class="panel-h"><h2>背包</h2>
      <div class="hint">${E.slotsUsed()} / ${E.mod().bag}</div></div>
      ${block('作物', groups.作物)}${block('物资', groups.物资)}${block('制品', groups.制品)}
    </section>`;
  }

  /* ---------------- 仓库 ---------------- */
  function viewStore() {
    const S = E.S;
    const cap = E.storeCap(), used = E.storeUsed();
    const over = used > cap;
    const home = E.atHome();
    const list = (obj, toStore) => Object.keys(obj).map(id => {
      const q = obj[id];
      if (!q) return '';
      const hot = toStore ? E.hotCount(id) : E.storeHotCount(id);
      const legal = q - (toStore ? E.hotCount(id) : E.storeHotCount(id));
      return `<div class="rowitem">
        <span class="ri-n" title="${attr(E.tipOf(id))}" data-tip="${attr(E.tipOf(id))}"><i class="qdot q${E.qualityOf(id)}"></i>${E.nameOf(id)}${hot ? `<em class="hot">赃×${hot}</em>` : ''}</span>
        <span class="ri-q">×${q}</span>
        <span class="ri-v">¥${Math.round(E.valueOf(id) * (id[0] === 'C' ? E.cropQuality(id) : 1))}</span>
        <span class="ri-a">
          ${home ? `<button class="mini" data-act="${toStore ? 'put' : 'take'}" data-v="${id}">${toStore ? '存入 1' : '取出 1'}</button>
          <button class="mini" data-act="${toStore ? 'putall' : 'takeall'}" data-v="${id}">${toStore ? '全存' : '全取'}</button>` : ''}
          ${home && !toStore ? (id[0] === 'I'
            ? '<span class="dim" title="关键道具：不能卖，也不能销毁" data-tip="关键道具：不能卖，也不能销毁">关键道具</span>'
            : `<button class="mini" data-act="sellstore" data-v="${id}" ${legal <= 0 ? 'disabled' : ''}>卖 1</button>
          <button class="mini" data-act="sellstoreall" data-v="${id}" ${legal <= 0 ? 'disabled' : ''}>全卖</button>
          ${D.ITEMS.find(x => x.id === id && x.use)
            ? `<button class="mini" data-act="use" data-v="${id}">使用</button>`
            : `<button class="mini" data-act="destroy" data-v="${id}">销毁</button>`}`) : ''}
        </span></div>`;
    }).join('') || '<div class="rowempty">空</div>';
    const lv = S.storeLv || 1;
    const next = D.STORE_LEVELS[lv];
    const nextCap = next ? next.cap + (E.hasTalent('TL-12') ? 8 : 0) : cap;
    const nextStack = next ? (next.stack || [4, 8, 12, 16][lv]) : E.stackMax('G-01');
    const needTxt = next ? next.need.map(n =>
      `<span class="${E.countAll(n[0]) >= n[1] ? 'ok' : 'down'}" title="${attr(E.tipOf(n[0]))}" data-tip="${attr(E.tipOf(n[0]))}">${E.nameOf(n[0])} ${E.countAll(n[0])}/${n[1]}</span>`).join(' + ') : '';
    const canUp = !!next && next.need.every(n => E.countAll(n[0]) >= n[1]);
    return `<section class="panel wide"><div class="panel-h"><h2>仓库</h2>
      <div class="hint">最大堆叠${E.stackMax('G-01')}</div></div>
      ${over ? `<div class="alert">仓库放不下了：${used}/${cap} 格，得把堆在外面的东西处理一下</div>` : ''}
      ${home ? '' : '<div class="note">人不在家，仓库只能查看。回到家才能存取、卖货和扩建。</div>'}
      <div class="store-h">
        <div><b class="${over ? 'down' : ''}">${used}/${cap}</b></div>
        ${!home ? '<span class="dim">只读</span>'
          : (S.storeUp ? `<span class="warn">扩建中，${S.storeUp.days} 天后完工</span>`
            : (lv < 4 ? `<button class="mini" data-act="upopen">升级</button>` : '<span class="dim">已满级</span>'))}
      </div>
      ${UI.upOpen && home && lv < 4 && !S.storeUp ? `<div class="up-box">
        <div>升级材料：${needTxt}</div>
        <div>最大容量 ${cap}→${nextCap}</div>
        <div>堆叠上限 ${E.stackMax('G-01')}→${nextStack}</div>
        <div class="up-b"><button class="mini" data-act="upstore" ${canUp ? '' : 'disabled'}>确认升级</button><button class="mini" data-act="upclose">取消</button></div>
      </div>` : ''}
      <div class="store-cols">
        <div><div class="sub-h">背包</div>${list(S.inv, true)}</div>
        <div><div class="sub-h">仓库</div>${list(S.store, false)}</div>
      </div>
      ${home ? `<div class="row-actions"><button data-act="sellcrops">卖掉所有作物</button></div>
      <div class="note">听说码头收赃物</div>` : ''}
    </section>`;
  }

  /* ---------------- 账目 ---------------- */
  function viewLedger() {
    const S = E.S;
    const sms = S.sms.map((s, i) => `<div class="sms ${s.done ? 'done' : ''}">
      <div class="sms-h">第 ${s.w} 周 · ${s.done ? '已读' : '未读'}</div>
      <div class="sms-t">${s.t}</div>

  function hiBest() {
    try {
      const raw = localStorage.getItem('lsz_hi');
      const obj = raw ? JSON.parse(raw) : null;
      if (!obj || typeof obj !== 'object') return null;
      if (typeof obj.score === 'number') {
        return Object.assign({}, obj, { score: Math.floor(obj.score) });
      }
      // 旧格式：按难度分开存，取其中最高的一条
      let best = null;
      ['ideal', 'real', 'hard'].forEach(k => {
        const r = obj[k];
        if (r && typeof r.score === 'number') {
          const score = Math.floor(r.score);
          if (!best || score > best.score) best = Object.assign({}, r, { score, diff: k });
        }
      });
      return best;
    } catch (e) { return null; }
  }
  function scoreOf(cash, key) {
    const rate = { ideal: 0.01, real: 0.1, hard: 1 }[key] || 0.01;
    return Math.floor(Math.max(0, cash) * rate);
  }
  function scoreFmt(v) {
    return String(Math.floor(v));
  }
  function recordHi() {
    const S = E.S;
    if (!S || !S.ended || S.hiRecorded) return;
    const cash = Math.max(0, Math.round(S.maxCash || S.money || 0));
    const score = scoreOf(cash, S.diffKey);
    const prev = hiBest();
    if (!prev || score > prev.score) {
      const rec = {
        score, cash, diff: S.diffKey, name: S.playerName || '无名',
        gen: S.generation || 1, day: S.day, code: S.ended, t: Date.now()
      };
      try { localStorage.setItem('lsz_hi', JSON.stringify(rec)); } catch (e) {}
    }
    S.hiRecorded = true;
  }
  function hiBoard() {
    const r = hiBest();
    return `<div class="best">
      <div class="best-h">最高得分</div>
      <div class="best-row"><span>最佳</span><b>${r ? scoreFmt(r.score) : '—'}</b></div>
      <div class="best-note">单局最高现金 ÷ 100 × 倍率（理想 1× · 现实 10× · 挑战 100×）</div>
    </div>`;
  }

  function addGone() {
    const S = E.S;
    if (!S || !S.ended || S.goneRecorded) return;
    const END_T = { A: '暴富逃出生天', B: '平稳还清', C: '被卖到旧港', D: '走法律途径', E: '隐藏真结局' };
    const arr = goneList();
    arr.push({
      t: Date.now(),
      name: S.playerName || '无名',
      gen: S.generation || 1,
      code: S.ended,
      reason: (END_T[S.ended] || '结束') + (S.endReason ? ' · ' + String(S.endReason).replace(/<[^>]*>/g, '') : '')
    });
    while (arr.length > 65535) arr.shift();
    try { localStorage.setItem('lsz_tomb', JSON.stringify(arr)); } catch (e) {}
    S.goneRecorded = true;
  }

  function goneBox() {
    const arr = goneList().slice().reverse();
    const rows = arr.slice(0, 300).map(r => {
      const d = new Date(r.t || Date.now());
      const ts = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' +
        String(d.getMinutes()).padStart(2, '0');
      return `<div class="gone-row"><span class="gt">${ts}</span><span class="gn">${esc(r.name || '无名')} · 第 ${r.gen || 1} 代</span><span class="gr">${esc(r.reason || '')}</span></div>`;

  /* ---------------- 渲染 ---------------- */
  function view() {
    const S = E.S;
    if (S.detained > 0) return viewDetained();
    if (S.hospital) return viewHospital();
    if (S.raid && UI.tab !== 'bag' && UI.tab !== 'log') return viewRaid();
    switch (UI.tab) {
      case 'farm': return viewFarm();
      case 'raid': return viewRaid();
      case 'market': return viewMarket();
      case 'craft': return viewCraft();
      case 'bag': return viewBag();
      case 'store': return viewStore();
      case 'ledger': return viewLedger();
      case 'log': return viewLog();
      default: return '';
    }
  }

  function render() {
    hideTip();
    const S = E.S;
    if (!S || UI.screen === 'title') {
      if (S && S.ended) { addGone(); recordHi(); }

  let trCache = {};

  function trKey(lang) { return 'lsz_tr_' + lang; }
  function trLoadCache(lang) {
    trCacheLang = lang;
    try {
      const raw = localStorage.getItem(trKey(lang));
      trCache = raw ? (JSON.parse(raw) || {}) : {};

  function trSaveCache() {
    try { localStorage.setItem(trKey(trCacheLang), JSON.stringify(trCache)); } catch (e) {}

  function trDecode(s) {
    const el = document.createElement('textarea');
    el.innerHTML = String(s == null ? '' : s);

  async function trFetchMany(texts, lang) {
    let url = 'https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=zh-CN&tl=' + encodeURIComponent(lang);
    texts.forEach(t => { url += '&q=' + encodeURIComponent(t.slice(0, 1200)); });
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('translate http ' + res.status);
    const data = await res.json();
    const arr = Array.isArray(data) ? data : [data];
    if (arr.length !== texts.length) throw new Error('translate shape');
    return arr.map(x => trDecode(Array.isArray(x) ? x[0] : x));
  }

  function scheduleTranslate() {

  async function translateDom(epoch) {
    if (epoch !== translationEpoch || UI.lang === 'zh-CN') return;
    const lang = UI.lang;
    const root = document.getElementById('app');
    if (!root) return;
    if (trCacheLang !== lang) trLoadCache(lang);
    trBlocked = false;
    const pending = new Map();
    const add = (key, apply) => {
      if (!pending.has(key)) pending.set(key, []);
      pending.get(key).push(apply);
    };
    const applyKnown = (key, val) => {
      (pending.get(key) || []).forEach(fn => fn(val));
      pending.delete(key);
    };
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    let node;
    while ((node = walker.nextNode())) {
      const raw = node.nodeValue || '';
      const key = raw.trim();
      if (!key || !trIsChinese(key)) continue;
      const fixed = FIXED_TRANSLATIONS[UI.lang] && FIXED_TRANSLATIONS[UI.lang][key];
      if (fixed) {
        node.nodeValue = raw.replace(key, fixed);
        continue;
      }
      const lead = raw.slice(0, raw.indexOf(key));
      const trail = raw.slice(raw.indexOf(key) + key.length);
      if (trCache[key]) { node.nodeValue = lead + trCache[key] + trail; continue; }
      const tn = node;
      add(key, val => { if (tn.isConnected) tn.nodeValue = lead + val + trail; });
    }
    root.querySelectorAll('[title],[placeholder],[data-tip],[aria-label]').forEach(el => {
      ['title', 'placeholder', 'data-tip', 'aria-label'].forEach(attr => {
        const raw = el.getAttribute(attr);
        if (!raw) return;
        const key = raw.trim();
        if (!key || !trIsChinese(key)) return;
        if (trCache[key]) { el.setAttribute(attr, trCache[key]); return; }
        add(key, val => { if (el.isConnected) el.setAttribute(attr, val); });
      });
    });
    const keys = Array.from(pending.keys());
    const batches = [];
    let batch = [], batchLen = 0;
    keys.forEach(key => {
      const t = key.slice(0, 1200);
      const need = encodeURIComponent(t).length + 3;
      if (batch.length && batchLen + need > 4000) {
        batches.push(batch);
        batch = []; batchLen = 0;
      }
      batch.push(key);
      batchLen += need;
    });
    if (batch.length) batches.push(batch);

    let failures = 0;
    let bi = 0;
    async function worker() {
      while (bi < batches.length && epoch === translationEpoch && !trBlocked) {
        const group = batches[bi++];
        try {
          const vals = await trFetchMany(group.map(k => k.slice(0, 1200)), lang);
          if (epoch !== translationEpoch || UI.lang !== lang) return;
          group.forEach((key, i) => {
            const val = vals[i];
            if (!val) return;
            trCache[key] = val;
            applyKnown(key, val);
          });
          trSaveCache();
        } catch (e) {
          failures++;
          if (failures >= 5) trBlocked = true;
        }
        await new Promise(r => setTimeout(r, 30));
      }
    }
    await Promise.all([worker(), worker(), worker()]);
    trSaveCache();
  }

  /* 体力见底 / 存在感激增前的二次确认 */
  function precheck(act, v, i) {
    const S = E.S;
    if (!S || S.ended) return null;
    const warn = [];
    const mod = E.mod();
    let cost = 0;
    if (act === 'plant') cost = 8;
    else if (act === 'harvest') cost = 6;
    else if (act === 'water') cost = E.hasTalent('TL-27') ? 0 : (S.fac['U-03'] ? 2 : 4);
    else if (act === 'fert') cost = 3;
    else if (act === 'inspect') cost = E.hasTalent('TL-04') ? 0 : 1;
    else if (act === 'advance' && S.raid) cost = (E.D.MAPS.find(m => m.id === S.raid.mapId) || {}).stam || 0;
    else if (act === 'search' && S.raid) {
      const map = E.D.MAPS.find(m => m.id === S.raid.mapId) || { stam: 4, presence: false };
      cost = Math.max(2, map.stam + mod.searchStam);
      if (mod.crowbar) cost = Math.max(1, Math.round(cost * 0.5));
      if (map.presence) {
        const gain = Math.round(13 * mod.presenceGain);
        const after = S.presence + gain;
        if (S.presence < 100 && after >= 100) warn.push('再拿就太明显了，肯定会被发现到的。');
        else if (S.presence < 50 && after >= 50) warn.push('感觉拿太多东西会很引人注意啊……');
      }
    }
    if (cost > 0) {
      const real = Math.max(1, Math.round(cost * mod.stamCost));
      if (S.stamina - real <= 0) {
        const fee = 50 + 12 * S.day;
        warn.push('再干下去就要脱力了（体力 ' + n1(S.stamina) + ' → 0）。');
        warn.push(S.money < fee
          ? '诊所的诊费是 ¥' + fee + '，口袋里只有 ¥' + S.money + '。'
          : '诊费 ¥' + fee + '，出院时结。');
      }
    }
    if (act === 'search' && S.raid && mod.crowbar && S.stamina <= 17 && !warn.some(w => String(w).includes('脱力'))) {
      const nextUse = (S.crowUses || 0) + 1;
      const hurtChance = nextUse <= 2 ? 0 : Math.min(1, 0.15 + 0.03 * (nextUse - 3));
      if (hurtChance > 0) warn.push('手里还拎着撬棍，真滑一下可能就脱力了。');
    }
    return warn.length ? warn : null;
  }

  function endDayAsks() {
    const S = E.S, out = [];
    if (!S || S.ended || S.raid || S.detained > 0 || S.hospital) return out;
    if (E.storeOver() && !S.overGrace) return out;
    const due = Math.round(S.due * (1 - S.cutDebt));

      const gap = p.dir > 0 ? (px - p.liq) / px : (p.liq - px) / px;
      return gap < 0.2;
    })) out.push('ledger');
    return out;
  }

          return;
        }
        doAction(el, p.act, p.v, p.i);
        render();
      }
      return;
    }
    const warn = precheck(act, v, i);
    if (warn) { UI.pending = { act, v, i, warn, el }; UI.pendingAt = Date.now(); render(); return; }
    if (act === 'endday') {
      const asks = endDayAsks();
      if (asks.length) {
        UI.askQueue = asks.slice(1);
        UI.ask = { kind: asks[0], next: { act: 'endday', el } };
        render();
        return;
      }
    }
    doAction(el, act, v, i);
    render();
  });

  document.addEventListener('keydown', ev => {
    if (ev.key !== 'Escape') return;
    if (UI.ask) { UI.ask = null; UI.askQueue = []; render(); return; }
    if (UI.newAsk) { UI.newAsk = null; render(); return; }
    if (UI.presetAsk) { UI.presetAsk = null; render(); return; }
    if (UI.drop) { UI.drop = null; render(); return; }
    if (UI.menu) { UI.menu = null; render(); return; }
    if (UI.settings) { UI.settings = false; render(); return; }
    if (UI.pending) { UI.pending = null; render(); return; }
    if (UI.dockAsk) { UI.dockAsk = null; render(); return; }
    if (UI.destroy) { UI.destroy = null; render(); return; }
    if (UI.gone) { UI.gone = false; render(); }
  });

  document.addEventListener('change', ev => {
    const el = ev.target;
    if (el.dataset.act === 'seed') {
      UI.seed = el.value;
      const wrap = el.closest('.seed-wrap');
      const lab = wrap && wrap.querySelector('.seed-label');
      if (lab) lab.innerHTML = E.nameOf(el.value) + '<i>▾</i>';
      const plot = el.closest('.plot');
      const btn = plot && plot.querySelector('[data-act="plant"]');
      if (btn) btn.textContent = '播种 ¥' + E.seedCost(el.value);
      refreshPlantAllTotal();
    }
    if (el.id === 'lang') { setLanguage(el.value); return; }
    if (el.id === 'margin') { UI.margin = Math.max(0, +el.value || 0); refreshEst(); }
  });
  document.addEventListener('input', ev => {
    const el = ev.target;
    if (el.dataset && el.dataset.themeColor) {
      UI.theme = 'custom';
      UI.customTheme[el.dataset.themeColor] = el.value;
      applyTheme();
      saveTheme();
    }
    if (el.id === 'pname') UI.name = el.value;
    if (el.id === 'margin') { UI.margin = Math.max(0, +el.value || 0); refreshEst(); }
    if (el.id === 'lev') UI.setLevIdx(el.value);
  });

  /* 杠杆滑块：1–9 步长 1，10–100 步长 10，10 为刻度转折点 */
  const levIdx = l => (l <= 9 ? Math.max(0, l - 1) : Math.round(l / 10) + 8);
  const idxLev = i => (i <= 8 ? i + 1 : (i - 8) * 10);
  window.levIdx = levIdx;

  UI.setLevIdx = function (i) { UI.setLev(idxLev(+i || 0)); };

  function refreshEst() {
    const est = document.querySelector('.est');
    if (!est || !E.S) return;
    const S = E.S, px = S.prices[UI.sel];
    const drop = (1 / UI.lev) * (1 - S.diff.keep) * E.mod().liqBuffer;
    const liq = UI.dir > 0 ? px * (1 - drop) : px * (1 + drop);
    const fee = Math.max(0, Math.round(UI.margin * UI.lev * E.mod().fee));
    est.innerHTML = `<div>名义仓位 <b>¥${money(UI.margin * UI.lev)}</b></div>
      <div>强平价 <b>${UI.lev <= 1 ? '不爆仓' : px3(liq)}</b>${UI.lev > 1 ? `（${(drop * 100).toFixed(2)}%）` : ''}</div>
      <div>手续费 <b>¥${money(fee)}</b> · 合计扣款 <b>¥${money(UI.margin + fee)}</b></div>`;
    const btn = document.getElementById('openbtn');
    if (btn) btn.textContent = UI.margin < S.diff.minOpen ? `下单（门槛 ¥${money(S.diff.minOpen)}）` : `下单（手续费 ¥${money(fee)}）`;
  }

  UI.setLev = function (v) {
    UI.lev = clamp(+v || 1, 1, 100);
    const lv = document.getElementById('levv');
    if (lv) {
      lv.textContent = UI.lev + '×';
      lv.className = UI.lev > 50 ? 'down' : '';
    }
    const sl = document.getElementById('lev');
    if (sl) sl.value = levIdx(UI.lev);
    refreshEst();
  };

  /* ---------------- 启动 ---------------- */
  window.addEventListener('error', ev => {
    const app = document.getElementById('app');
    if (!app || !ev || !ev.message) return;
    app.innerHTML = '<div style="max-width:720px;margin:80px auto;padding:24px;border:1px solid #3a3f4a;' +
      'background:#191d25;color:#d7d1c3;font:14px/1.9 system-ui,sans-serif">' +
      '<div style="letter-spacing:2px;margin-bottom:12px">页面出错了</div>' +
      '<div style="color:#cf7f74;margin-bottom:16px">' + ev.message + '</div>' +
      '<div style="color:#8b857a;margin-bottom:16px">旧记录和这一版对不上。清掉重来，就能回到镇口。</div>' +
      '<button onclick="__fresh()" style="border:1px solid #d6b26a;padding:6px 14px;color:#d6b26a;background:none">清掉旧记录</button>' +
      '</div>';
  });

  const q = new URLSearchParams(location.search);
  try {
    if (q.get('oldsave') && !sessionStorage.getItem('lsz_olddone')) {
      const legacy = {
        day: 7, week: 2, money: 300, stamina: 100, san: 100, presence: 0,
        inv: { 'C-01': 2 }, plots: [0, 1, 2, 3].map(() => ({ crop: null, planted: 0, days: 0, fert: 90 })),
        prices: {}, prev: {}, positions: [], totalDebt: 17000, due: 320, dueIn: 4,
        realized: 0, stolen: 0, paid: 300, debt0: 17860, log: [], sms: [], flag: {},
        raid: null, dayMode: null, delivered: false, ended: null, diffKey: 'real', diff: D.DIFFS.real
      };
      localStorage.setItem('lsz_save', JSON.stringify(legacy));
      sessionStorage.setItem('lsz_olddone', '1');
      location.reload();
      return;
    }
  } catch (e) {}
  if (q.get('lev')) UI.lev = Math.max(1, Math.min(100, +q.get('lev')));
  try { UI.name = localStorage.getItem('lsz_name') || ''; } catch (e) {}
  UI.screen = 'title';
  if (q.get('dev')) {
    E.newGame(q.get('dev'));
    E.S.playerName = UI.name || '无名';
    UI.screen = 'game';
    const n = +q.get('auto') || 0;
    for (let k = 0; k < n; k++) {
      if (E.S.ended) break;
      E.startFarm();
      for (let i = 0; i < E.S.plots.length; i++) {
        const p = E.S.plots[i];
        if (p.crop && (p.watered || 0) < p.days) E.water(i);
      }
      for (let i = 0; i < E.S.plots.length; i++) {
        const st = E.plotState(i);
        if (st.empty && E.S.money > E.seedCost('C-01')) E.plant(i, 'C-01');
        else if (!st.empty && st.mature) E.harvest(i);
      }
      Object.keys(E.S.inv).forEach(id => { if (id[0] === 'C') E.sellLegal(id, E.legalCount(id)); });
      Object.keys(E.S.store).forEach(id => { if (id[0] === 'C') E.sellFromStore(id, E.S.store[id]); });
      if (E.S.money > 4000 && !E.S.positions.length) E.openPosition('M-01', 1, E.S.diff.minOpen, 5);
      E.endDay();
    }
    const rd = q.get('raid');
    if (rd) {
      E.startRaid(rd);
      for (let k = 0; k < 3; k++) E.searchContainer();
    }
    const st = q.get('state');
    if (st === 'hosp') E.S.hospital = { stage: 2, fee: 150, left: 2 };
    if (st === 'det') E.S.detained = 2;
    if (q.get('stock')) {
      E.S.store = { 'G-03': 30, 'G-04': 12, 'C-01': 6, 'G-12': 8 };
      E.addInv('G-11', 3); E.addInv('C-06', 2);
    }
    if (q.get('own')) {
      E.S.store[q.get('own')] = (E.S.store[q.get('own')] || 0) + 2;
      UI.craftFilter = 'all';
    }
    if (q.get('tal')) {
      E.S.talents = q.get('tal').split(',');
      E.recalc();
    }
    if (q.get('over')) {
      E.S.store = {};
      E.D.MATS.forEach(m => { E.S.store[m.id] = E.stackMax(m.id) * 2; });
    }
    if (q.get('back') && E.S.raid) {
      while (E.S.raid && E.S.raid.node < E.S.raid.nodes) E.advance();
      E.extract();
    }
    if (q.get('check')) E.inspectPlot(+q.get('check') - 1);
    if (q.get('dockask')) { E.S.storeHot['G-03'] = 2; UI.dockAsk = 'D-07'; }
    if (q.get('rest')) E.S.hospital = { stage: 2, fee: 120, rest: true };
    if (q.get('bagtest')) {
      E.addInv('G-03', 5); E.addInv('C-01', 3); E.addInv('G-11', 2);
      UI.tab = 'bag';
    }
    if (q.get('destroy')) {
      const id = q.get('destroy');
      E.S.store[id] = 6; E.S.storeHot[id] = 4;
      UI.tab = 'store';
      UI.destroy = { id, max: 6, hot: 4 };
    }
  }
  if (q.get('tab')) UI.tab = q.get('tab');
  if (q.get('menu')) UI.menu = 'rules';
  if (q.get('selftest')) UI.screen = 'game';
  if (q.get('confirm') && E.S) {
    UI.pending = { act: 'search', v: null, i: 0, warn: [
      '再干下去就要脱力了（体力 2 → 0）。',
      '诊所的诊费是 ¥134，口袋里只有 ¥72。'
    ] };
  }
  if (q.get('tomb')) {
    try {
      localStorage.setItem('lsz_tomb', JSON.stringify([
        { t: Date.now() - 86400000 * 2, name: '阿土', gen: 1, reason: '周供 300 元，现金只有 100 元。林特敲了第二下门。' },
        { t: Date.now() - 3600000, name: '阿土', gen: 2, reason: '连着两期都在特殊场景里——债主不再等了。' }
      ]));
      UI.gone = true;
    } catch (e) {}
  }
  if (q.get('end') && E.S) E.finish(q.get('end'));
  render();

  /* 隐藏自测：?selftest=1 */
  if (q.get('selftest')) {
    const click = sel => {
      const el = document.querySelector(sel);
      if (!el) throw new Error('missing:' + sel);
      el.click();
    };
    let msg;
    try {
      UI.screen = 'title'; UI.name = '阿土'; UI.tip = ''; render();
      click('[data-act="newgame"][data-v="real"]');
      E.S.talents = [];
      E.recalc();
      const named = E.S.playerName === '阿土' && UI.screen === 'game';
      UI.tab = 'farm'; render();
      click('[data-act="plant"][data-i="0"]');
      click('[data-act="plant"][data-i="1"]');
      click('[data-act="inspect"][data-i="0"]');
      const inspectOk = /号田/.test(E.S.log[0].t);
      for (let k = 0; k < 4; k++) {
        const w0 = document.querySelector('[data-act="water"][data-i="0"]');
        if (w0) w0.click();
        const w1 = document.querySelector('[data-act="water"][data-i="1"]');
        if (w1) w1.click();
        click('[data-act="endday"]');
      }
      click('[data-act="harvest"][data-i="0"]');
      UI.tab = 'store'; render();
      click('[data-act="sellstore"][data-v="C-01"]');
      click('[data-act="endday"]');
      E.S.money = 50000;
      UI.tab = 'market'; render();
      click('[data-act="open"]');
      click('[data-act="close"]');
      UI.tab = 'raid'; render();
      click('[data-act="start"][data-v="D-03"]');
      for (let k = 0; k < 5; k++) {
        const b = document.querySelector('[data-act="advance"]');
        if (b && !b.disabled) b.click();
      }
      click('[data-act="search"]');
      click('[data-act="extract"]');
      click('[data-act="endday"]');
      // 体力耗尽的二次确认
      E.S.stamina = 8; E.S.money = 10;
      UI.tab = 'raid'; render();
      click('[data-act="start"][data-v="D-03"]');
      click('[data-act="advance"]');
      click('[data-act="search"]');
      const confShown = !!UI.pending;
      click('[data-act="confirmNo"]');
      const confCancel = !UI.pending && E.S.stamina === 4;
      E.S.raid = null; E.S.dayMode = null; E.S.stamina = 100; E.S.money = 50000;
      // 医院
      E.S.hospital = { stage: 2, fee: 50, left: 2 };
      render();
      click('[data-act="hsearch"]');
      click('[data-act="endday"]');
      // 拘留
      E.arrest('自测：被抓。');
      render();
      click('[data-act="endday"]');
      // 品级与脏物
      E.S.detained = 0;
      E.addInv('G-35', 1, { hot: true });
      E.addInv('G-15', 1);
      UI.tab = 'bag'; render();
      const hotBefore = E.hotValue();
      // 去码头前的赃物确认
      E.S.store['G-03'] = (E.S.store['G-03'] || 0) + 2;
      E.S.storeHot['G-03'] = 2;
      E.addInv('J-25', 1, { silent: true });
      const moneyBeforeDock = E.S.money;
      UI.tab = 'raid'; render();
      click('[data-act="start"][data-v="D-07"]');
      const dockShown = !!UI.dockAsk;
      click('[data-act="dockTake"]');
      const dockTaken = !!E.S.raid;
      const dockSold = E.hotValue() === 0 && E.S.money > moneyBeforeDock;
      E.S.raid = null; E.S.dayMode = null;
      E.S.stamina = 100;
      E.addInv('G-07', 1); E.addInv('G-01', 1); E.addInv('G-04', 1);
      UI.tab = 'craft'; render();
      click('[data-act="craft"][data-v="J-01"]');
      // 仓库
      E.addInv('G-02', 1);
      E.S.store['G-03'] = 20; E.S.store['G-04'] = 10;
      UI.tab = 'store'; render();
      click('[data-act="put"][data-v="G-02"]');
      click('[data-act="upopen"]');
      click('[data-act="upstore"]');
      const lvAfter = E.S.storeUp ? E.S.storeUp.lv : E.S.storeLv;
      // 立刻完工（测试用），再备齐水井材料
      E.S.storeLv = 2; E.S.storeUp = null;
      E.S.store['G-03'] = 12; E.S.store['G-14'] = 12;
      // 设施
      UI.tab = 'farm'; render();
      click('[data-act="factoggle"]');
      click('[data-act="build"][data-v="U-03"]');
      const well = !!E.S.fac['U-03'];
      // 预设
      UI.tab = 'market'; render();
      click('[data-act="preset"][data-v="1"]');
      const presetOk = UI.sel === D.PRESETS[1].cid;
      // 交割
      E.S.money = 50000;
      E.addInv('C-01', 3, { silent: true });
      E.addInv('I-05', 1, { silent: true });
      E.openPosition('M-01', -1, 3000, 5);
      render();
      click('[data-act="deliver"]');
      const delivered = (E.S.deliveredCount || 0) === 1;
      UI.tab = 'ledger'; render();
      click('[data-act="sms"][data-v="0"]');
      UI.tab = 'log'; render();
      click('[data-act="settings"]');
      click('[data-act="settingsrules"]');
      click('[data-act="menuclose"]');
      // 主页面 / 继续 / 失踪名单
      UI.screen = 'title'; render();
      click('[data-act="continue"]');
      const contOk = UI.screen === 'game';
      // 特殊场景无视爆仓
      E.S.store = {}; E.S.storeHot = {};
      E.D.MATS.slice(0, 10).forEach(m => { E.S.store[m.id] = E.stackMax(m.id) * 4; });
      E.S.hospital = { stage: 2, fee: 0, left: 2 };
      E.S.money = 50000;
      const dBefore = E.S.day;
      render();
      click('[data-act="endday"]');
      const sceneOverOk = E.S.day === dBefore + 1 && !E.S.hospital;
      E.S.hospital = null;
      E.finish('C');
      render();
      UI.screen = 'title'; render();
      click('[data-act="gone"]');
      const goneOk = document.querySelectorAll('.gone-row').length > 0;
      click('[data-act="goneclose"]');
      msg = 'SELFTEST OK  day=' + E.S.day + '  money=' + Math.round(E.S.money)
        + '  bag=' + E.slotsUsed() + '/' + E.mod().bag + '  hotBefore=' + Math.round(hotBefore)
        + '  hotAfter=' + Math.round(E.hotValue()) + '  storeLv=' + lvAfter
        + '  well=' + well + '  preset=' + presetOk + '  deliver=' + delivered
        + '  named=' + named + '  cont=' + contOk + '  gone=' + goneOk
        + '  conf=' + confShown + '/' + confCancel + '  check=' + inspectOk
        + '  dock=' + dockShown + '/' + dockTaken + '/' + dockSold + '  sceneOver=' + sceneOverOk
        + '  log=' + E.S.log.length;
    } catch (e) {
      msg = 'SELFTEST FAIL  ' + e.message;
    }
    document.title = msg;
    document.getElementById('app').innerHTML =
      '<div style="padding:40px;font:15px Consolas,monospace;color:#d7d1c3;white-space:pre-wrap;line-height:1.9">'
      + msg + '\n\n' + (E.S ? E.S.log.slice(0, 12).map(l => 'D' + l.d + ' ' + l.t).join('\n') : '')
      + '</div>';
  }
})();

</script>
</body>
</html>
