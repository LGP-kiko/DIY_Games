<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="game-version" content="0.1.1">
<title>老实种田，很枯燥吧 · 文字版</title>
<style>
:root{
  --bg:#101216;
  --bg2:#151820;
  --panel:#191d25;
  --panel2:#1e232c;
  --line:#2b313c;
  --text:#d7d1c3;
  --dim:#8a8579;
  --faint:#5f5b52;
  --green:#86c08f;
  --red:#cf7f74;
  --gold:#d6b26a;
  --blue:#7f9fc0;
  --input:#0e1014;
  --head:#e8e2d2;
  --track:#0c0e12;
  --log-h:26.8vh;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{
  font-family:"Consolas","SFMono-Regular","Liberation Mono","Noto Sans Mono CJK SC","Microsoft YaHei",monospace;
  font-size:14px;line-height:1.55;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 4px);
}
#app{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
h1,h2,h3{margin:0;font-weight:600}
b{font-weight:600}
button{font-family:inherit;font-size:13px;color:var(--text);background:transparent;border:1px solid var(--line);
  padding:5px 10px;cursor:pointer;transition:.12s;border-radius:2px}
button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
button:disabled{opacity:.35;cursor:default}
button.primary{border-color:var(--gold);color:var(--gold)}
button.primary:hover{background:var(--gold);color:#15130d}
button.mini{padding:2px 7px;font-size:12px}
button.danger{border-color:#6d3a34;color:var(--red)}
button.danger:hover{background:#3a1f1b;color:#ffd9d2}
input,select{font-family:inherit;font-size:13px;background:var(--input);color:var(--text);
  border:1px solid var(--line);padding:5px 7px;border-radius:2px}
input[type=range]{padding:0;accent-color:var(--gold)}
select:focus,input:focus{outline:none;border-color:var(--faint)}

/* ---------- HUD ---------- */
.hud{display:flex;flex-direction:column;gap:9px;padding:10px 0 12px;border-bottom:1px solid var(--line)}
.hud-top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
.hud-brand{flex:0 0 auto}
.brand-cn{font-size:19px;letter-spacing:2px;color:var(--head)}
.brand-en{font-size:11px;color:var(--faint);letter-spacing:1px;margin-top:2px;white-space:nowrap}
.hud-stats{display:flex;gap:20px;flex-wrap:nowrap}
.stat{display:flex;flex-direction:column;line-height:1.3}
.stat .k{font-size:10px;color:var(--faint);letter-spacing:1px}
.stat b{font-size:15px;font-variant-numeric:tabular-nums}
.stat b i{font-style:normal;font-size:11px;color:var(--dim);margin-left:4px}
.money{color:var(--gold)}
.debt{color:var(--red)}
.ok{color:var(--green)}
.bars{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end}
.bar{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim)}
.bar .track{width:76px;height:6px;background:var(--track);border:1px solid var(--line)}
.bar .fill{display:block;height:100%}
.fill.sta{background:#8aa77f}.fill.san{background:#7f93b8}.fill.pre{background:#b07a6c}.fill.bag{background:#a89a72}
.bar em{font-style:normal;font-size:11px;color:var(--text);min-width:34px}

/* ---------- 导航 ---------- */
.tabs{display:flex;gap:2px;flex-wrap:wrap;margin:14px 0 16px;border-bottom:1px solid var(--line)}
.tab{border:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 14px;color:var(--dim);letter-spacing:1px}
.tab:hover{border-bottom-color:var(--faint);color:var(--text)}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.tab.danger{margin-left:auto;color:var(--red);border:1px solid #5a2f2a}
.tab.danger:hover{border-color:var(--red);color:#ffd9d2}

/* ---------- 面板 ---------- */
.panel{background:var(--panel);border:1px solid var(--line);padding:16px 18px 18px}
.panel.wide{padding-bottom:24px}
.panel-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;margin-bottom:14px}
.panel-h h2{font-size:15px;letter-spacing:3px;color:var(--head)}
.hint{font-size:11px;color:var(--faint)}
.note{font-size:11px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px;margin-top:14px;line-height:1.7}
.note.small{font-size:10px}
.season-pick{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px;font-size:11.5px;color:var(--dim)}
.season-pick .sp-h{color:var(--faint);margin-right:2px}
.season-pick .sp-h b{color:var(--gold);font-weight:600}
.seedchip{border:1px solid var(--line);background:var(--panel2);color:var(--dim);padding:3px 8px;font-size:11.5px;border-radius:2px;cursor:pointer}
.seedchip:hover{border-color:var(--gold);color:var(--text)}
.seedchip.on{border-color:var(--gold);color:var(--gold)}
.seedchip i{font-style:normal;color:var(--faint);margin-left:5px;font-size:10.5px}
.seedchip.on i{color:var(--gold)}
.sub-h{font-size:11px;letter-spacing:2px;color:var(--dim);margin:16px 0 8px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.fac-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fac-toggle{width:26px;height:26px;padding:0;border:1px solid var(--dim);background:transparent;color:var(--text);font-size:18px;line-height:24px;text-align:center}
.fac-toggle:hover{color:var(--gold);border-color:var(--gold)}
.up-box{border:1px solid var(--line);background:var(--panel2);padding:10px 12px;margin:8px 0 12px;font-size:12px;color:var(--dim);line-height:1.9}
.up-b{display:flex;gap:8px;margin-top:8px}

/* ---------- 农场 ---------- */
.plots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.plot{background:var(--panel2);border:1px solid var(--line);padding:10px}
.plot.empty{opacity:.92}
.plot-h{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
.fert{height:4px;background:var(--track);margin:6px 0 4px}
.fert i{display:block;height:100%;background:#7f8f63}
.fert-n{font-size:10px;color:var(--faint);margin-bottom:8px}
.plot-b{display:flex;gap:6px;flex-wrap:wrap}
.plot-b .seed-wrap{position:relative;flex:1 1 100%;margin-bottom:4px}
.plot-b .seed-label{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:5px 7px;border:1px solid var(--line);background:var(--input);color:var(--text);font-size:12px;line-height:1.4}
.plot-b .seed-label i{font-style:normal;color:var(--dim);font-size:10px}
.plot-b .seed-select{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.plot-b .seed-wrap:focus-within .seed-label{border-color:var(--faint)}
.plot-b button{flex:1;padding:5px 4px}

/* ---------- 外出 ---------- */
.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.map{text-align:left;padding:12px;border:1px solid var(--line);background:var(--panel2)}
.map.off{opacity:.4}
.map-h{display:flex;justify-content:space-between;margin-bottom:6px}
.map-b{font-size:11px;color:var(--dim)}
.map-loot{font-size:10px;color:var(--faint);margin-top:6px}
.map-req{font-size:10px;margin-top:5px}
.warn{color:var(--gold)}
.depth{height:5px;background:var(--track);border:1px solid var(--line);margin:0 0 14px}
.depth i{display:block;height:100%;background:linear-gradient(90deg,#6f7f5c,#d6b26a)}
.qdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
.q1{background:#cfcabd}.q2{background:#7fa8d8}.q3{background:#b08fd0}.q4{background:#d6b26a}.q5{background:#cf7f74}
.hot{font-style:normal;font-size:10px;color:var(--red);margin-left:6px;border:1px solid #5a2f2a;padding:0 4px}
.raid-actions{display:flex;gap:10px;margin-top:6px}
.raid-actions button{flex:1;padding:10px}

/* ---------- 市场 ---------- */
.market{display:grid;grid-template-columns:1fr 300px;gap:14px}
.quotes{max-height:430px;overflow:auto;border:1px solid var(--line)}
table.grid{width:100%;border-collapse:collapse;font-size:12.5px}
table.grid th{font-weight:400;font-size:10px;letter-spacing:1px;color:var(--faint);text-align:left;
  padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
table.grid td{padding:5px 8px;border-bottom:1px solid rgba(43,49,60,.55)}
table.grid tr:hover td{background:rgba(255,255,255,.02)}
table.grid tr.sel td{background:rgba(214,178,106,.07)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--green)}.down{color:var(--red)}
.ticket{background:var(--panel2);border:1px solid var(--line);padding:12px}
.ticket-h{display:flex;justify-content:space-between;margin-bottom:8px}
.ticket-px{font-size:13px;margin-bottom:10px}
.ticket-px b{font-size:18px;color:var(--gold)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:6px}
.seg button.on.long{border-color:var(--green);color:var(--green)}
.seg button.on.short{border-color:var(--red);color:var(--red)}
.field{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);margin-bottom:10px;white-space:nowrap}
.field span{flex:0 0 44px}
.field input[type=number]{width:100%}
.field input[type=range]{flex:1}
.est{font-size:11px;color:var(--dim);border-top:1px dashed var(--line);padding-top:8px;margin-bottom:10px}
.est b{color:var(--text)}
.positions{margin-top:16px}
.positions table{font-size:12px}

/* ---------- 制作 ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:11px;padding:3px 9px;color:var(--dim)}
.chip.on{border-color:var(--gold);color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--panel2);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px}
.card.off{opacity:.55}
.card-h{display:flex;justify-content:space-between;font-size:13px}
.card-d{font-size:11.5px;color:var(--dim)}
.card-r{font-size:11px;line-height:1.7}
.card-r span{margin-right:6px}
.card-b{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.card-b button{padding:4px 12px}

/* ---------- 背包 ---------- */
.bag-g{margin-bottom:14px}
.rowitem{display:grid;grid-template-columns:minmax(0,1fr) 52px 64px 240px;gap:12px;align-items:center;padding:7px 8px;border-bottom:1px solid rgba(43,49,60,.6);font-size:12.5px}
.rowitem:hover{background:rgba(255,255,255,.02)}
.ri-n{display:flex;align-items:baseline;gap:10px;min-width:0}
.ri-n:after{content:"";flex:1;border-bottom:1px dotted rgba(90,96,108,.45);transform:translateY(-3px)}
.ri-q{text-align:right;color:var(--dim)}
.ri-v{text-align:right;color:var(--faint)}
.ri-a{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;min-width:0}
.rowempty{color:var(--faint);font-size:12px;padding:7px 8px}

/* ---------- 仓库 ---------- */
.store-h{display:flex;gap:20px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--dim)}
.store-h b{color:var(--text);font-variant-numeric:tabular-nums}
.store-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}

/* ---------- 设施 ---------- */
.facs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.fac{background:var(--panel2);border:1px solid var(--line);padding:9px;display:flex;flex-direction:column;gap:5px}
.fac.built{border-color:#3f5a43}
.fac.off{opacity:.5}
.fac-h{display:flex;justify-content:space-between;font-size:12px}
.fac-d{font-size:10.5px;color:var(--dim);line-height:1.6}
.fac-n{font-size:10px;line-height:1.7}
.fac button{margin-top:auto;padding:3px}

/* ---------- 技能 ---------- */
.skills{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.skill{background:var(--panel2);border:1px solid var(--line);padding:9px}
.skill-h{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
.xpbar{height:3px;background:var(--track);margin-bottom:6px}
.xpbar i{display:block;height:100%;background:#7f8f63}
.skill-d{font-size:10px;color:var(--faint);line-height:1.6}

/* ---------- 预设 ---------- */
.pset{display:inline-flex;align-items:center;border:1px solid var(--line)}
.pset button{border:none;padding:3px 7px;font-size:11px;color:var(--dim)}
.pset button:hover{color:var(--gold)}
.pset i{font-style:normal;color:var(--faint);padding:0 6px;cursor:pointer;border-left:1px solid var(--line)}
.pset i:hover{color:var(--red)}

.alert{border:1px solid #6a3a34;background:#2a1c1a;color:#e0a79f;padding:10px 12px;font-size:12px;line-height:1.7;margin-bottom:12px}
.over-chip{margin-left:10px;padding:3px 9px;font-size:11px;border:1px solid #6a3a34;color:#e0a79f;background:#2a1c1a;cursor:pointer;align-self:center}
.row-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}

/* ---------- 账目 ---------- */
.ledger{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line)}
.led{background:var(--panel2);padding:10px 12px;display:flex;justify-content:space-between;font-size:12px;flex:1 1 46%}
.led span{color:var(--dim)}
.smslist{display:flex;flex-wrap:wrap;gap:10px}
.sms{background:var(--panel2);border:1px solid var(--line);padding:10px;flex:1 1 280px}
.sms.done{opacity:.5}
.sms-h{font-size:10px;color:var(--faint);margin-bottom:4px}
.sms-t{margin-bottom:8px}

/* ---------- 记录 ---------- */
.loglist{max-height:560px;overflow:auto;font-size:12px}
.loglist.short{max-height:220px}
.logpanel{margin-top:14px}
.log-resize{display:none}
.plan{display:flex;gap:6px;flex-wrap:wrap}
.pchip{font-size:11px;padding:3px 9px;border:1px solid var(--line);color:var(--dim)}
.pchip.done{opacity:.4;text-decoration:line-through}
.pchip.now{border-color:var(--gold);color:var(--gold)}
.rules{font-size:12px;color:var(--dim);line-height:2}
.logline{padding:4px 0;border-bottom:1px dotted rgba(43,49,60,.6);color:var(--dim)}
.logline .ld{color:var(--faint);margin-right:8px;font-size:10px}
.logline.good{color:var(--green)}
.logline.bad{color:var(--red)}
.logline.warn{color:var(--gold)}
.logline.info{color:var(--blue)}

/* ---------- 覆盖层 ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,9,12,.92);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.intro,.endcard{max-width:620px;width:100%;background:var(--panel);border:1px solid var(--line);padding:34px 36px}
.intro{position:relative}
.intro-k,.end-k{font-size:10px;letter-spacing:3px;color:var(--faint)}
.intro h1,.endcard h1{font-size:30px;letter-spacing:6px;margin:10px 0 14px;color:var(--head)}
.tag{color:var(--dim);font-size:12.5px;line-height:1.9;border-left:2px solid var(--gold);padding-left:12px}
.intro-rules{margin:20px 0;font-size:12px;color:var(--dim);line-height:2}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.diffs button{padding:12px 8px;display:flex;flex-direction:column;gap:4px}
.diffs small{font-size:10px;color:var(--faint)}
.link{background:none;border:none;color:var(--faint);font-size:11px;margin-top:16px;text-decoration:underline}
.endcard p{color:var(--dim);line-height:1.9;margin:14px 0 20px}
.end-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:20px}
.end-stats div{display:flex;flex-direction:column;gap:4px}
.end-stats span{font-size:10px;color:var(--faint)}
.end-stats b{font-size:15px;color:var(--gold)}
.foot{margin-top:22px;text-align:center;font-size:10px;color:var(--faint);letter-spacing:1px}
.ver{position:fixed;right:14px;bottom:10px;z-index:60;font-size:10px;color:var(--dim);letter-spacing:1px;pointer-events:none}

/* ---------- 菜单 ---------- */
.menubtn{border:1px solid var(--line);padding:4px 12px;font-size:12px;color:var(--dim);align-self:flex-start}
.menubtn:hover{color:var(--gold);border-color:var(--gold)}
.hud-actions{display:flex;gap:8px;align-items:center;align-self:flex-start}
.gearbtn{border:1px solid var(--line);padding:3px 8px;font-size:18px;line-height:1.2;color:var(--dim);font-family:"Segoe UI Symbol","Noto Sans Symbols",sans-serif}
.gear-svg{display:block;width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gearbtn:hover{color:var(--gold);border-color:var(--gold)}
.modal{position:fixed;inset:0;background:rgba(8,9,12,.88);display:flex;align-items:center;justify-content:center;z-index:70;padding:24px}
.modal-card{max-width:720px;width:100%;max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);padding:22px 26px}
.modal-h{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;position:sticky;top:-22px;background:var(--panel);z-index:2}
.modal-h h2{font-size:15px;letter-spacing:3px;color:var(--head)}
.modal-acts{display:flex;gap:8px}
.rule-g{margin:0 0 14px}
.rule-g b{display:block;color:var(--head);font-size:12.5px;letter-spacing:1px;margin-bottom:4px}
.rule-g p{margin:2px 0;font-size:12px;color:var(--dim);line-height:1.8}
.rule-note{font-size:11px;color:var(--faint);border-top:1px dashed var(--line);padding-top:10px;margin-top:6px}
.theme-grid{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.theme-chip{display:flex;align-items:center;gap:6px;padding:3px 7px;font-size:11px;color:var(--dim)}
.theme-chip.on{color:var(--gold);border-color:var(--gold)}
.theme-chip .sw{display:inline-flex;width:22px;height:12px;border:1px solid var(--line);overflow:hidden}
.theme-chip .sw i{display:block;width:50%;height:100%}
.theme-actions{display:flex;gap:8px;margin:4px 0}
.theme-colors{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:11px;color:var(--dim)}
.theme-colors label{display:flex;align-items:center;gap:5px}
.theme-colors input[type=color]{width:28px;height:22px;padding:1px;background:var(--input);border:1px solid var(--line)}
.settings-card{max-width:760px}
.settings-actions{display:flex;flex-direction:column;gap:8px}
.settings-actions button{text-align:left;padding:8px 12px}
.langselect{width:100%;padding:8px 10px;font-size:14px}
.translate-note{font-size:11px;color:var(--dim);line-height:1.7;margin-top:8px}
@media (max-width:620px){.langselect{font-size:16px}}
.modal-b{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.modal-card.narrow{max-width:460px}
.modal-card.narrow .rules p{font-size:12px;color:var(--dim);line-height:1.9;margin:0 0 8px}
#dcount{width:96px;background:var(--input);border:1px solid var(--line);color:var(--text);padding:4px 7px}
.end-gen{color:var(--dim);font-size:12px;line-height:1.8;margin:14px 0 6px}
button.secondary{border:1px solid var(--line);color:var(--dim);padding:7px 18px;margin-left:10px}
button.secondary:hover{color:var(--text);border-color:var(--dim)}

/* ---------- 主页面 ---------- */
.newgame{margin:18px 0 6px}
.namefield{margin-bottom:12px}
.namefield input{width:100%}
.title-acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.title-gear{position:absolute;right:14px;top:14px;z-index:5}
.title-acts button{flex:1;min-width:120px;padding:9px 12px;border:1px solid var(--line);color:var(--dim)}
.title-acts button.primary{border-color:var(--gold);color:var(--gold)}
.title-acts button:disabled{opacity:.35}
.title-tip{color:var(--red);font-size:12px;margin-top:10px}
.gone-list{max-height:52vh;overflow:auto}
.gone-row{display:flex;gap:12px;padding:8px 6px;border-bottom:1px dashed var(--line);font-size:12px;align-items:baseline}
.gone-row .gt{color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.gone-row .gn{color:var(--text);white-space:nowrap}
.gone-row .gr{color:var(--dim);flex:1}


@media (max-width:900px){
  .rowitem{grid-template-columns:minmax(0,1fr) 46px 58px 200px}
  .market{grid-template-columns:1fr}
  .cards{grid-template-columns:repeat(2,1fr)}

    if (kind === 'insurance') log('有新的邮件，好像是保险发来的', 'info');
    else log('有新的邮件，空白署名？', 'info');
  }
  E.addMail = addMail;

  /* ---------------- 天赋 ---------------- */
  E.talentOf = id => (D.TALENTS || []).find(t => t.id === id);
  E.hasTalent = id => !!(E.S && (E.S.talents || []).indexOf(id) >= 0);
  E.rollTalents = function (key) {
    const n = key === 'ideal' ? 4 : key === 'hard' ? 2 : 3;
    const w = { 1: 55, 2: 27, 3: 13, 4: 5 };
    const pool = (D.TALENTS || []).slice();
    const out = [];
    while (out.length < n && pool.length) {
      const total = pool.reduce((a, t) => a + (w[t.r] || 1), 0);
      let r = Math.random() * total, k = 0;
      for (let i = 0; i < pool.length; i++) { r -= (w[pool[i].r] || 1); if (r <= 0) { k = i; break; } }
      out.push(pool[k].id);
      pool.splice(k, 1);
    }
    return out;
  };

  E.newGame = function (diffKey) {
    const key = D.DIFFS[diffKey] ? diffKey : 'real';
    const prices = {}, prev = {};
    D.CONTRACTS.forEach(c => { prices[c.id] = c.p0; prev[c.id] = c.p0; });
    const S = {
      diffKey: key, diff: D.DIFFS[key],
      day: 1, week: 1, money: T.initialMoney,
      stamina: T.baseStaminaMax, staminaMax: T.baseStaminaMax, san: T.baseSanMax, sanMax: T.baseSanMax,
      presence: 0,
      plots: [0, 1, 2, 3].map(() => ({ crop: null, planted: 0, days: 0, fert: 100, watered: 0, stress: 0 })),
      inv: {}, hot: {}, q: {}, storeHot: {},
      store: {}, storeLv: 1,
      fac: {}, skills: {}, xp: {},
      presets: D.PRESETS.map(p => Object.assign({ system: true }, p)),
      prices, prev, positions: [],
      realized: 0, stolen: 0,
      detained: 0, hospital: null,
      paid: 0, debt0: 0, totalDebt: 0, due: 300, dueIn: 7,
      cutDebt: 0, deferOnce: false, deferAt: 0, lastExempt: false, overGrace: false,
      flag: {}, raid: null, dayMode: null,
      talents: [], intelWeek: 0, lockUses: 0, crowUses: 0,
      delivered: false, sms: [], mail: [], news: null, shocks: [],
      handWeek: 0, forecast: null,
      maxCash: 0, hiRecorded: false,
      log: [], ended: null, opened: 0
    };
    E.S = S;
    D.SKILLS.forEach(s => { S.skills[s.id] = 0; S.xp[s.id] = 0; });
    S.talents = E.rollTalents(key);
    if (E.hasTalent('TL-32')) S.money += 2000;
    E.recalc();
    S.stamina = S.staminaMax;
    S.san = S.sanMax;
    S.maxCash = Math.max(S.maxCash || 0, S.money);
    let plan = 0;
    const weeks = (S.diff.dues || D.WEEK_DUES.real).length;
    for (let w = 1; w <= weeks; w++) plan += E.weekAmount(w);
    S.debt0 = plan;
    S.totalDebt = plan;
    S.due = E.weekAmount(1);
    smsForWeek(1);
    log('第 1 周，周供 ' + money(S.due) + ' 元，现金 ' + money(S.money) + ' 元。先去地里，还是去镇上转转？');
    log('天赋：' + S.talents.map(id => E.talTag(id)).join('、') + '。', 'info');
    return S;
  };

  /* ---------------- 物品与品级 ---------------- */
  E.qualityOf = function (id) {
    if (MAT[id]) return MAT[id].q;
    if (ITEM[id]) return ITEM[id].q;
    const k = D.KEYITEMS.find(x => x.id === id);
    return k ? k.q : 1;
  };
  E.quality = q => Q[q] || Q[1];

  E.nameOf = function (id) {
    return (CROP[id] && CROP[id].n) || (MAT[id] && MAT[id].n) || (ITEM[id] && ITEM[id].n)
      || (D.KEYITEMS.find(x => x.id === id) || {}).n || id;
  };

  E.valueOf = function (id) {
    if (CROP[id]) return E.cropUnit(CROP[id]);
    if (MAT[id]) return MAT[id].v;
    if (ITEM[id]) return Math.round((ITEM[id].need || []).reduce((a, n) => a + E.valueOf(n[0]) * n[1], 0) * 1.4);
    const k = D.KEYITEMS.find(x => x.id === id);
    return k ? 120 : 1;
  };

  E.hotValue = function () {
    const S = E.S;
    return Object.keys(S.hot || {}).reduce((a, id) => a + (S.hot[id] || 0) * E.valueOf(id), 0);
  };

  /* 悬停提示：不重复名称与品级，只说价值、用途 */
  E.usesOf = function (id) {
    const names = D.ITEMS.filter(it => (it.need || []).some(n => n[0] === id)).map(it => it.n);
    if (!names.length) return '';
    return names.slice(0, 3).join('、') + (names.length > 3 ? ' 等' : '');
  };
  E.tipOf = function (id) {
    if (CROP[id]) {
      const c = CROP[id];
      const uses = E.usesOf(id);
      return c.days + ' 天成熟 · 基准价 ¥' + Math.round(c.price * 1.5) + (uses ? ' · 可用于：' + uses : '');
    }
    if (MAT[id]) {
      const uses = E.usesOf(id);
      return '基准价 ¥' + MAT[id].v + (uses ? ' · 可用于：' + uses : '');
    }
    if (ITEM[id]) return ITEM[id].desc || '';
    const k = D.KEYITEMS.find(x => x.id === id);
    if (k) return k.desc || '';
    return '';
  };
  const escAttr = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  E.talentName = function (id) {
    const t = E.talentOf(id);
    return t ? t.n : id;
  };
  E.talentTip = function (id) {
    if (id === 'TL-26') return '每周首单名义100000及以下合约首日必定不会亏损';
    const fixed = {
      'TL-11': '赃物出手价为九成。',
      'TL-16': '仓库里的作物损耗减半；有冷库时不损耗。',
      'TL-30': '下地和出门同一天都能做。'
    }[id];
    if (fixed) return fixed;
    const t = E.talentOf(id);
    return t ? (t.long || t.desc || '') : id;
  };
  E.talTag = function (id) {
    const t = E.talentOf(id);
    if (!t) return id;
    const tip = escAttr(E.talentTip(id));
    return '<span class="tal q' + t.r + '" title="' + tip + '" data-tip="' + tip + '">' + E.talentName(id) + '</span>';
  };

  E.sz = function (id) {
    if (ITEM[id] && ITEM[id].sz) return ITEM[id].sz;
    const k = D.KEYITEMS.find(x => x.id === id);
    if (k) return 0;
    return 1;
  };
  E.isBulk = id => !!(id && (id[0] === 'C' || (D.MK_IDS || []).indexOf(id) >= 0));
  E.slotsUsed = () => Object.keys(E.S.inv).reduce((a, k) => a + (E.S.inv[k] || 0) * E.sz(k), 0);
  E.countInv = id => (E.S.inv[id] || 0);
  E.stackMax = function (id) {
    const S = E.S;
    if (E.isBulk(id)) return 9999;
    const lv = Math.min(4, Math.max(1, (S && S.storeLv) || 1));
    const row = D.STORE_LEVELS[lv - 1] || {};
    return row.stack || [4, 8, 12, 16][lv - 1];
  };
  E.season = function (day) {
    return D.SEASONS[Math.floor(((day || E.S.day) - 1) / 7) % 4];
  };
  E.legalCount = id => Math.max(0, (E.S.inv[id] || 0) - (E.S.hot[id] || 0));
  E.hotCount = id => (E.S.hot[id] || 0);

  /* 容器类背包只生效一件；扩展件可叠三件 */
  E.mod = function () {
    const S = E.S;
    const m = { stamCost: 1, sanLoss: 1, presenceGain: 1, bag: T.baseBag, fee: T.marketFee, sell: 1, yield: 1, growth: 0, offSeason: 0.6, searchStam: 0, lockpick: false, crowbar: false, liqBuffer: 1 };
    if (!S) return m;
    let containerBest = 0, stackBag = 0;
    const CONTAINER_ITEMS = { 'J-11': 3, 'J-12': 6, 'J-13': 2, 'I-07': 4 };
    Object.keys(S.inv).forEach(id => {
      if (!S.inv[id]) return;
      const it = ITEM[id];
      if (CONTAINER_ITEMS[id]) containerBest = Math.max(containerBest, CONTAINER_ITEMS[id]);
      if (!it || !it.passive) return;
      const p = it.passive;
      if (p.stamCost) m.stamCost += p.stamCost;
      if (p.sanLoss) m.sanLoss += p.sanLoss;
      if (p.presenceGain) m.presenceGain += p.presenceGain;
      if (p.fee) m.fee += p.fee;
      if (p.sell && id !== 'J-40') m.sell += p.sell;
      if (p.yield) m.yield += p.yield;
      if (p.growth) m.growth += p.growth;
      if (p.offSeason) m.offSeason = p.offSeason;
      if (p.searchStam) m.searchStam += p.searchStam;
      if (p.liqBuffer) m.liqBuffer += p.liqBuffer;
      if (p.lockpick) m.lockpick = true;
      if (p.crowbar) m.crowbar = true;
      if (p.stack) stackBag += (p.bag || 0) * Math.min(p.stack, S.inv[id] || 0);
      else if (p.bag && !CONTAINER_ITEMS[id]) m.bag += p.bag;
    });
    m.bag += containerBest + stackBag;
    m.stamCost = Math.max(0.3, m.stamCost);
    m.bag = Math.max(8, m.bag);
    const lv = id => (S.skills && S.skills[id]) || 0;
    m.fee -= 0.0002 * lv('A-04');
    m.searchStam -= 0.3 * lv('A-05');
    m.yield += 0.03 * lv('A-01');
    if (S.fac && S.fac['U-02']) m.offSeason = Math.max(m.offSeason, 0.85);
    if (E.hasTalent('TL-03')) m.sanLoss = Math.max(0.3, m.sanLoss - 0.25);
    if (E.hasTalent('TL-06')) m.liqBuffer += 0.1;
    if (E.hasTalent('TL-09')) m.bag += 10;
    if (E.hasTalent('TL-13')) m.sell += 0.08;
    if (E.hasTalent('TL-15')) m.fee *= 0.75;
    m.fee = Math.max(0, m.fee);
    if (E.hasTalent('TL-19')) m.presenceGain *= 0.5;
    if (E.hasTalent('TL-20')) m.stamCost *= 0.8;
    if (E.hasTalent('TL-28')) m.growth -= 1;
    return m;
  };

  /* ---------------- 技能 ---------------- */
  const XP_TH = [20, 60, 120, 200, 300];
  E.recalc = function () {
    const S = E.S;
    S.staminaMax = T.baseStaminaMax + 4 * (S.skills['A-02'] || 0) + (E.hasTalent('TL-01') ? 10 : 0);
    S.sanMax = T.baseSanMax + 4 * (S.skills['A-03'] || 0);
    S.stamina = Math.min(S.stamina, S.staminaMax);
    S.san = Math.min(S.san, S.sanMax);
  };

  E.addXp = function (id, n) {
    const S = E.S;
    if (!S.xp) return;
    S.xp[id] = (S.xp[id] || 0) + n;
    let lv = 0;
    XP_TH.forEach(t => { if (S.xp[id] >= t) lv++; });
    if (lv > (S.skills[id] || 0)) {
      S.skills[id] = lv;
      E.recalc();
      const sk = D.SKILLS.find(x => x.id === id);
      const FLAVOR = {
        'A-01': '种地的手感更熟了',
        'A-02': '身子骨结实了些',
        'A-03': '心定了一些',
        'A-04': '看盘的眼力好了些',
        'A-05': '翻东西的手更快了'
      };
      log((FLAVOR[id] || '又熟练了些') + (sk ? '（' + sk.n + '）' : '') + '。', 'good');
    }
  };

  /* ---------------- 仓库 ---------------- */
  E.storeCap = function () {
    const S = E.S;
    const row = D.STORE_LEVELS[Math.min(3, (S.storeLv || 1) - 1)];
    return row.cap + (E.hasTalent('TL-12') ? 8 : 0);
  };
  E.storeUsed = () => Object.keys(E.S.store || {}).reduce((a, k) => a + (k[0] === 'I' ? 0 : Math.ceil(E.S.store[k] / E.stackMax(k))), 0);
  E.storeOver = () => E.storeUsed() > E.storeCap();

  /* 仓库数量变动后，保证“赃物份数”不超过实际库存 */
  function clampStoreHot(id) {
    const S = E.S;
    const h = S.storeHot[id] || 0;
    if (!h) return;
    const st = S.store[id] || 0;
    if (st <= 0) { delete S.storeHot[id]; return; }
    if (h > st) S.storeHot[id] = st;
  }

  /* 回家：作物、物资和门槛道具自动卸进仓库（可超容）；其他制品与关键道具留在身上 */
  E.isGateItem = id => (D.MAPS || []).some(m => m.req === id);

  E.autoStore = function () {
    const S = E.S;
    let moved = 0;
    Object.keys(S.inv).forEach(id => {
      if (id[0] === 'I') return;
      const gate = id[0] === 'J' && E.isGateItem(id);
      if (id[0] !== 'C' && id[0] !== 'G' && !gate) return;
      const qty = S.inv[id];
      const h = Math.min(qty, S.hot[id] || 0);
      moved += qty;
      S.store[id] = (S.store[id] || 0) + qty;
      if (h > 0) S.storeHot[id] = (S.storeHot[id] || 0) + h;
      delete S.inv[id];
      delete S.hot[id];
    });
    if (moved) log('把 ' + moved + ' 件货卸进仓库（' + E.storeUsed() + '/' + E.storeCap() + '）。');
    if (E.storeOver()) log('仓库放不下了。', 'bad');
  };

  E.storeHotCount = id => (E.S.storeHot[id] || 0);
  E.storeHotValue = () => Object.keys(E.S.storeHot || {}).reduce((a, id) => a + E.S.storeHot[id] * E.valueOf(id), 0);

  E.sellFromStore = function (id, qty) {
    const S = E.S;
    if (id[0] === 'I') { log('这东西不能卖。', 'warn'); return; }
    if (!E.atHome()) { log('人不在家，卖不了仓库里的货。', 'warn'); return; }
    const legal = (S.store[id] || 0) - (S.storeHot[id] || 0);
    qty = Math.min(qty || 1, Math.max(0, legal));
    if (qty <= 0) { log('这批货带「赃」标，家里不收。', 'warn'); return; }
    S.store[id] -= qty;
    if (S.store[id] <= 0) { delete S.store[id]; delete S.storeHot[id]; }
    else clampStoreHot(id);
    const qual = id[0] === 'C' ? E.cropQuality(id) : 1;
    const unit = Math.round(E.valueOf(id) * E.mod().sell * qual);
    S.money += unit * qty;
    if (id[0] === 'C' && !(S.inv[id] || S.store[id])) delete S.q[id];
    log('从仓库卖掉' + E.nameOf(id) + '×' + qty + '，得 ' + money(unit * qty) + ' 元。');
  };
  E.countAll = id => (E.S.inv[id] || 0) + (E.S.store[id] || 0);
  E.owned = id => (E.S.inv[id] || 0) + (E.S.store[id] || 0);

  /* 消耗顺序：仓库赃物 → 背包赃物 → 仓库合法货 → 背包合法货 */
  function consumeItem(id, qty) {
    const S = E.S;
    let need = qty;
    const fromStoreHot = Math.min(need, S.storeHot[id] || 0);
    if (fromStoreHot) {
      S.storeHot[id] -= fromStoreHot;
      S.store[id] -= fromStoreHot;
      need -= fromStoreHot;
      if (S.storeHot[id] <= 0) delete S.storeHot[id];
      if ((S.store[id] || 0) <= 0) { delete S.store[id]; delete S.storeHot[id]; }
    }
    if (need > 0) {
      const fromBagHot = Math.min(need, S.hot[id] || 0);
      if (fromBagHot) {
        E.takeInv(id, fromBagHot);
        need -= fromBagHot;
      }
    }
    if (need > 0) {
      const fromStore = Math.min(need, S.store[id] || 0);
      if (fromStore) {
        S.store[id] -= fromStore;
        need -= fromStore;
        if (S.store[id] <= 0) delete S.store[id];
        else clampStoreHot(id);
      }
    }
    if (need > 0) E.takeInv(id, need);
    clampStoreHot(id);
  }
  E.takeAny = consumeItem;
  E.consumeAll = consumeItem;

  E.destroyStore = function (id, qty) {
    const S = E.S;
    if (id[0] === 'I') { log('这东西不能处理掉。', 'warn'); return; }
    if (!E.atHome()) { log('人不在家，动不了仓库里的东西。', 'warn'); return; }
    const max = S.store[id] || 0;
    qty = Math.max(0, Math.min(Math.floor(qty) || 0, max));
    if (!qty) return;
    const h = Math.min(qty, S.storeHot[id] || 0);
    S.store[id] -= qty;
    if (h > 0) {
      S.storeHot[id] -= h;
      if (S.storeHot[id] <= 0) delete S.storeHot[id];
    }
    if (S.store[id] <= 0) { delete S.store[id]; delete S.storeHot[id]; }
    else clampStoreHot(id);
    if (id[0] === 'C' && !(S.inv[id] || S.store[id])) delete S.q[id];
    log('把 ' + qty + ' 件' + E.nameOf(id) + '处理掉了。', 'warn');
  };

  /* 只有在宅内才能动仓库；外出与特殊场景只能看 */
  E.atHome = function () {
    const S = E.S;
    return !!S && !S.raid && !(S.detained > 0) && !S.hospital;
  };

  E.transfer = function (id, qty, toStore) {
    const S = E.S;
    if (!E.atHome()) { log('人不在家，动不了仓库里的东西。', 'warn'); return; }
    if (toStore) {
      if (id[0] === 'I') {
        qty = Math.min(qty, S.inv[id] || 0);
        if (qty <= 0) { log('没有可存的东西。', 'warn'); return; }
        const hotMove = Math.min(qty, S.hot[id] || 0);
        E.takeInv(id, qty);
        S.store[id] = (S.store[id] || 0) + qty;
        if (hotMove > 0) S.storeHot[id] = (S.storeHot[id] || 0) + hotMove;
        log('把 ' + E.nameOf(id) + '×' + qty + ' 存进仓库。');
        return;
      }
      const cur = S.store[id] || 0;
      qty = Math.min(qty, S.inv[id] || 0);
      if (qty <= 0) { log('没有可存的东西。', 'warn'); return; }
      const hotMove = Math.min(qty, S.hot[id] || 0);
      E.takeInv(id, qty);
      S.store[id] = cur + qty;
      if (hotMove > 0) S.storeHot[id] = (S.storeHot[id] || 0) + hotMove;
      log('把 ' + E.nameOf(id) + '×' + qty + ' 存进仓库。');
    } else {
      const sz = E.sz(id);
      const free = sz <= 0 ? Infinity : Math.floor(Math.max(0, E.mod().bag - E.slotsUsed()) / sz);
      qty = Math.min(qty, S.store[id] || 0, free);
      if (qty <= 0) { log('背包放不下。', 'warn'); return; }
      const hotMove = Math.min(qty, S.storeHot[id] || 0);
      S.store[id] -= qty;
      if (S.store[id] <= 0) { delete S.store[id]; delete S.storeHot[id]; }
      else if (hotMove > 0) {
        S.storeHot[id] -= hotMove;
        if (S.storeHot[id] <= 0) delete S.storeHot[id];
      }
      E.addInv(id, qty, { silent: true });
      if (hotMove > 0) S.hot[id] = (S.hot[id] || 0) + hotMove;
      log('从仓库取出 ' + E.nameOf(id) + '×' + qty + '。');
    }
  };

  E.upgradeStore = function () {
    const S = E.S;
    if (!E.atHome()) { log('人不在家，没法张罗扩建。', 'warn'); return; }
    if (S.storeUp) { log('仓库正在扩建，还有 ' + S.storeUp.days + ' 天。', 'warn'); return; }
    const lv = S.storeLv || 1;
    if (lv >= 4) { log('仓库已经是最高级。', 'warn'); return; }
    const next = D.STORE_LEVELS[lv];
    const lack = next.need.filter(n => E.countAll(n[0]) < n[1]);
    if (lack.length) {
      log('升级材料不够：' + next.need.map(n => E.nameOf(n[0]) + ' ' + E.countAll(n[0]) + '/' + n[1]).join('，'), 'warn');
      return;
    }
    next.need.forEach(n => E.consumeAll(n[0], n[1]));
    S.storeUp = { lv: lv + 1, days: lv };
    log('仓库开始扩建，' + lv + ' 天后完工。', 'info');
  };

  /* ---------------- 农场设施 ---------------- */
  E.buildFacility = function (id) {
    const S = E.S;
    const f = D.FACILITIES.find(x => x.id === id);
    if (!f || f.reserved) { log('这个设施还没开放。', 'warn'); return; }
    const isLand = id === 'U-01';
    if (isLand) {
      if (S.plots.length >= (E.hasTalent('TL-23') ? 8 : 6)) { log('没有更多可开垦的地了。', 'warn'); return; }
    } else if (S.fac[id]) { log('已经建过了。', 'warn'); return; }
    if (f.req && !E.countAll(f.req)) { log('需要先拿到' + E.nameOf(f.req) + '。', 'warn'); return; }
    const lack = f.need.filter(n => E.countAll(n[0]) < n[1]);
    if (lack.length) {
      log('材料不够：' + f.need.map(n => E.nameOf(n[0]) + ' ' + E.countAll(n[0]) + '/' + n[1]).join('，'), 'warn');
      return;
    }
    f.need.forEach(n => E.consumeAll(n[0], n[1]));
    S.fac[id] = true;
    if (isLand) {
      S.plots.push({ crop: null, planted: 0, days: 0, fert: 100 });
      log('开垦出一块新地，现在有 ' + S.plots.length + ' 块田。', 'good');
      return;
    }
    log('建成了' + f.n + '。', 'good');
  };

  /* ---------------- 预设 ---------------- */
  E.presetMax = 10;

  E.savePreset = function (name, cid, dir, margin, lev) {
    const S = E.S;
    if (S.presets.length >= E.presetMax) { log('预设已经存满十个了。', 'warn'); return; }
    const n = (name || '自定 ' + (S.presets.filter(p => !p.system).length + 1)).replace(/[<>&]/g, '').slice(0, 8) || '自定';
    S.presets.push({
      id: 'S-' + (S.presets.length + 1), n, diff: S.diffKey,
      cid: cid || 'M-01', dir: dir || 1,
      margin: margin || S.diff.minOpen,
      lev: lev || 5, system: false
    });
    log('已存为预设：' + n + '。', 'good');
  };

  E.deletePreset = function (idx) {
    const S = E.S;
    if (!S.presets[idx]) return;
    S.presets.splice(idx, 1);
  };

  /* ---------------- 交割 ---------------- */
  E.deliveryCrop = function (cid) {
    const hit = Object.keys(CROP_OF).find(k => k === cid);
    return hit ? CROP_OF[hit] : null;
  };

  E.canDeliver = function (p) {
    if (p.dir > 0) return false;
    const crop = E.deliveryCrop(p.cid);
    if (!crop) return false;
    return E.owned(crop) >= 3 && (E.S.inv['I-05'] || 0) >= 1;
  };

  E.deliverPosition = function (pid) {
    const S = E.S;
    if (!E.atHome()) { log('人不在家，交割办不了。', 'warn'); return; }
    const p = S.positions.find(x => x.pid === pid);
    if (!p || !E.canDeliver(p)) { log('没有可交割的现货或仓单存根。', 'warn'); return; }
    const crop = E.deliveryCrop(p.cid);
    E.takeAny(crop, 3);
    E.takeInv('I-05', 1);
    S.money += Math.round(p.margin * (E.hasTalent('TL-18') ? T.deliveryTalentMult : 1) * (E.countAll('J-40') > 0 ? T.boxDeliveryMult : 1));
    S.positions = S.positions.filter(x => x !== p);
    S.deliveredCount = (S.deliveredCount || 0) + 1;
    log('把三份' + E.nameOf(crop) + '注册成仓单，交割平掉' + CONT[p.cid].n + '空单，保证金退回。', 'good');
  };


  E.addInv = function (id, qty, opts) {
    const S = E.S, hot = opts && opts.hot;
    const sz = E.sz(id);
    const add = sz <= 0 ? qty : Math.min(qty, Math.floor(Math.max(0, E.mod().bag - E.slotsUsed()) / sz));
    if (add <= 0) {
      if (!(opts && opts.silent)) log('背包满了，' + E.nameOf(id) + '没能装下。', 'warn');
      return 0;
    }
    const before = S.inv[id] || 0;
    S.inv[id] = before + add;
    if (hot) S.hot[id] = (S.hot[id] || 0) + add;
    return add;
  };

  E.takeInv = function (id, qty) {
    const S = E.S;
    if ((S.inv[id] || 0) < qty) return false;
    S.inv[id] -= qty;
    if (S.inv[id] <= 0) delete S.inv[id];
    const h = Math.min(qty, S.hot[id] || 0);
    if (h) {
      S.hot[id] -= h;
      if (S.hot[id] <= 0) delete S.hot[id];
    }
    return true;
  };

  E.dropInv = function (id, qty) {
    const S = E.S;
    const have = S.inv[id] || 0;
    qty = Math.min(qty || 0, have);
    if (qty <= 0) return;
    S.inv[id] -= qty;
    if (S.inv[id] <= 0) delete S.inv[id];
    const h = Math.min(qty, S.hot[id] || 0);
    if (h) {
      S.hot[id] -= h;
      if (S.hot[id] <= 0) delete S.hot[id];
    }
    if (id[0] === 'C' && !(S.inv[id] || S.store[id]) && S.q) delete S.q[id];
    log('扔掉了 ' + E.nameOf(id) + '×' + qty + '。', 'warn');
  };

  E.takeHot = function (id, qty) {
    const S = E.S;
    const h = Math.min(qty, S.hot[id] || 0);
    if (!h) return 0;
    E.takeInv(id, h);
    return h;
  };

  E.useStamina = function (n) {
    const S = E.S;
    S.stamina = clamp(S.stamina - Math.round(n * E.mod().stamCost), 0, S.staminaMax);
    if (S.stamina <= 0 && !S.hospital) E.collapse();
  };

  /* 体力归零：丢一半背包，进医院（可搜两格） */
  E.collapse = function () {
    const S = E.S;
    if (S.flag.pillArmed && E.countAll('I-03') > 0) {
      E.consumeAll('I-03', 1);
      S.flag.pillArmed = false;
      S.flag.sanShield = false;
      S.raid = null;
      S.dayMode = null;
      S.stamina = 10;
      E.autoStore();
      if (E.storeOver()) S.overGrace = true;
      log('含了片薄荷味药片，嘴里发凉，慢慢走回了家。', 'warn');
      return;
    }
    S.flag.pillArmed = false;
    let lost = 0;
    if (!S.flag.keepBag) {
      Object.keys(S.inv).forEach((id, i) => {
        if (id[0] === 'I') return;
        if (i % 2 === 0) { lost += S.inv[id]; delete S.inv[id]; delete S.hot[id]; }
      });
    }
    S.flag.keepBag = false;
    S.flag.sanShield = false;
    S.san = Math.max(0, S.san - 10);
    S.raid = null;
    S.dayMode = null;
    const fee = Math.round((T.clinicBase + T.clinicPerDay * S.day) * (E.hasTalent('TL-24') ? 0.5 : 1));
    if (S.money < fee) {
      log('体力见底，醒来时人在诊所。诊费 ' + money(fee) + ' 元，口袋里只有 ' + money(S.money) + ' 元。柜台后的人摇了摇头。', 'bad');
      E.finish('C');
      return;
    }
    S.hospital = { stage: 1, fee, left: 2 };
    log('体力见底，眼前一黑。再醒来时人在诊所，诊费 ' + money(fee) + ' 元待结。', 'bad');
    if (lost > 0) log('包好像比记忆里轻了些。', 'bad');
    else log('运气还不错，包还是原样。', 'warn');
  };

  /* ---------------- 时间与债务 ---------------- */
  E.weekAmount = function (w) {
    const table = (E.S.diff && E.S.diff.dues) || D.WEEK_DUES.real;
    return table[Math.min(table.length - 1, Math.max(0, w - 1))];
  };

  E.endDay = function () {
    const S = E.S;
    if (S.ended) return;
    if (S.raid) { log('还没回家。', 'warn'); return; }
    if (!S.detained && !S.hospital && E.storeOver() && !S.overGrace) {
      log('仓库放不下了（' + E.storeUsed() + '/' + E.storeCap() + ' 格），得把堆在外面的东西处理一下。', 'warn');
      return;
    }
    if (!S.detained && !S.hospital && !E.storeOver()) S.overGrace = false;
    if (!S.detained && !S.hospital && E.storeOver() && S.overGrace) {
      log('仓库堆得连下脚的地方都没有，今晚先这么过。', 'warn');
      S.overGrace = false;
    }
    if (S.detained > 0) {
      tickDebt();
      if (S.ended) return;
      S.detained--;
      log('拘留所里又过了一天。' + (S.detained ? '还有 ' + S.detained + ' 天。' : '今天放出来了。'), 'bad');
      if (S.detained <= 0) {
        E.autoStore();
        if (E.storeOver()) S.overGrace = true;
      }
      advanceDay();
      return;
    }
    if (S.hospital) {
      /* 第一天：昏迷，过完剧情；第二天：住院，占掉这一天 */
      if (S.hospital.stage === 1) {
        S.hospital.stage = 2;
        tickDebt();
        if (S.ended) return;
        log('在诊所躺了一夜。明天还得留院观察一天。', 'warn');
        advanceDay();
        return;
      }
      tickDebt();
      if (S.ended) return;
      const fee = S.hospital.fee;
      if (S.money < fee) {
        log('出院时结不起 ' + money(fee) + ' 元诊费。', 'bad');
        E.finish('C');
        return;
      }
      S.money -= fee;
      S.hospital = null;
      log('结了 ' + money(fee) + ' 元诊费，出院。', 'good');
      E.autoStore();
      if (E.storeOver()) S.overGrace = true;
      advanceDay();
      return;
    }
    tickDebt();
    if (S.ended) return;
    advanceDay();
  };

  function advanceDay() {
    const S = E.S;
    S.day++;
    S.stamina = Math.min(S.staminaMax, S.stamina + Math.ceil(S.staminaMax * T.dailyStaminaPct));
    const sanDay = Math.ceil(S.sanMax * T.dailySanPct) + (E.hasTalent('TL-08') ? T.sanGoodSleep : 0) + (E.hasTalent('TL-10') ? T.sanOptimist : 0);
    S.san = Math.min(S.sanMax, S.san + sanDay);
    S.presence = Math.floor(S.presence * T.presenceDecay);
    S.crowUses = 0;
    S.dayMode = null;
    E.addXp('A-02', 1);
    E.addXp('A-03', 1);
    S.plots.forEach(p => {
      if (!p.crop) return;
      const crop = CROP[p.crop];
      const drain = (crop.fert / crop.days) * (E.hasTalent('TL-07') ? 0.75 : 1) * (1 - 0.03 * (S.skills['A-01'] || 0));
      p.fert = p.fert - drain;
      if (p.fert < 0) {
        p.fert = 0;
        p.stress = (p.stress || 0) + 1;
      } else if (p.fert > 100) p.fert = 100;
    });
    if (S.storeUp) {
      S.storeUp.days--;
      if (S.storeUp.days <= 0) {
        S.storeLv = S.storeUp.lv;
        S.storeUp = null;
        log('仓库扩建完工，可存 ' + E.storeCap() + ' 格。', 'good');
      }
    }
    spoilStore();
    markPrices();
  }
  E.advanceDay = advanceDay;

  /* 仓库损耗：冷库归零，否则按作物冷库损耗逐日折损 */
  function spoilStore() {
    const S = E.S;
    if (S.fac && S.fac['U-04']) return;
    const rateOf = { '低': 0.01, '中': 0.02, '高': 0.04, '极高': 0.08 };
    Object.keys(S.store || {}).forEach(id => {
      if (id[0] !== 'C') return;
      const crop = CROP[id];
      if (!crop) return;
      const rate = (rateOf[crop.cold] || 0.02) * (E.hasTalent('TL-16') ? 0.5 : 1) * (S.store['J-39'] ? T.padSpoilMult : 1);
      const q = S.store[id];
      let lost = 0;
      for (let i = 0; i < q; i++) if (Math.random() < rate) lost++;
      if (lost) {
        S.store[id] -= lost;
        if (S.store[id] <= 0) { delete S.store[id]; delete S.storeHot[id]; }
        else clampStoreHot(id);
        log('仓库里的' + crop.n + '坏了 ' + lost + ' 份。', 'warn');
      }
    });
  }

  function tickDebt() {
    const S = E.S;
    if (S.deferAt) {
      if (S.day >= S.deferAt) { S.deferAt = 0; doSettle(); }
      return;
    }
    S.dueIn--;
    if (S.dueIn > 0) return;
    if (S.deferOnce) {
      S.deferOnce = false;
      S.deferAt = S.day + 1;
      S.dueIn = 1;
      log('周供延期一天，明晚结算。', 'warn');
      return;
    }
    doSettle();
  }

  function doSettle() {
    const S = E.S;
    const due = Math.round(S.due * (1 - S.cutDebt));
    S.cutDebt = 0;
    S.dueIn = 7;
    S.deferAt = 0;
    if (S.detained > 0 || S.hospital) {
      if (S.lastExempt) {
        log('连着两期都在特殊场景里——债主不再等了。', 'bad');
        E.finish('C');
        return;
      }
      S.lastExempt = true;
      const carry = Math.round(due * 1.5);
      const nextBase = E.weekAmount(S.week + 1);
      S.due = Math.round((nextBase + carry) / 10) * 10;
      S.week++;
      smsForWeek(S.week);
      weekPerks();
      log('人在特殊场景里，见不到债主。本期 ' + money(due) + ' 元按 1.5 倍滚入下周，下周应还 ' + money(S.due) + ' 元。', 'warn');
      return;
    }
    if (S.money < due) {
      if (S.flag.noteArmed && E.countAll('I-04') > 0) {
        S.flag.noteArmed = false;
        E.consumeAll('I-04', 1);
        if (Math.random() < 0.6) {
          S.lastExempt = true;
          const carry = Math.round(due * 1.5);
          S.due = Math.round((E.weekAmount(S.week + 1) + carry) / 10) * 10;
          S.week++;
          smsForWeek(S.week);
          weekPerks();
          log('空白病历上的名字对得上，这期先欠着。下周应还 ' + money(S.due) + ' 元。', 'warn');
          return;
        }
        S.detained = Math.max(S.detained || 0, 3);
        S.dueIn = 3;
        log('病历被看出破绽。柯恩把我带走，关三天。', 'bad');
        return;
      }
      log('周供 ' + money(due) + ' 元，现金只有 ' + money(S.money) + ' 元。林特敲了第二下门。', 'bad');
      E.finish('C');
      return;
    }
    S.money -= due;
    S.paid += due;
    if (E.hasTalent('TL-21') && S.money > 0) {
      const it = Math.round(S.money * 0.15);
      S.money += it;
      log(E.talTag('TL-21') + '把剩下的现金拿去生息，+' + money(it) + ' 元。', 'good');
    }
    S.totalDebt = Math.max(0, S.totalDebt - due);
    S.lastExempt = false;
    log('付出周供 ' + money(due) + ' 元，剩余债务 ' + money(S.totalDebt) + ' 元。', 'good');
    S.week++;
    if (S.totalDebt <= 0) { E.finishAuto(); return; }
    S.due = E.weekAmount(S.week);
    smsForWeek(S.week);
    weekPerks();
    log('第 ' + S.week + ' 周，本期周供 ' + money(S.due) + ' 元。', 'info');
    checkEnd();
  }

  function weekPerks() {
    const S = E.S;
    if (E.countAll('I-06') > 0) {
      S.money += 500;
      S.sms.push({ w: S.week, t: '桓：这周的给你了。', done: false });
      log('门缝里塞进来一个信封，里面是 500 元。', 'good');
    }
  }

  function smsForWeek(w) {
    const S = E.S;
    const t = { 1: '芙蕾雅：吃饭没？', 2: '芙蕾雅：学校要交材料费。', 3: '芙蕾雅：班里排节目，要三束月见葵。', 4: '芙蕾雅：不用了，你别勉强。' }[w];
    if (t) S.sms.push({ w, t, done: false });
  }

  E.readSms = function (i) {
    const S = E.S, s = S.sms[i];
    if (!s || s.done) return;
    s.done = true;
    S.san = Math.min(S.sanMax, S.san + 5);
    log('读了一遍短信，心里松了一点。', 'good');
  };

  E.deliverFlower = function () {
    const S = E.S;
    if (!E.atHome()) { log('人不在家，花送不出去。', 'warn'); return; }
    if (S.delivered) { log('已经交过了。', 'warn'); return; }
    if (E.owned('C-03') < 3) { log('手里没有三束月见葵。', 'warn'); return; }
    E.takeAny('C-03', 3);
    S.delivered = true;
    S.san = Math.min(S.sanMax, S.san + 10);
    log('把三束月见葵交给她。她没说什么，抱走了。', 'good');
  };

  /* ---------------- 价格 ---------------- */
  const CROP_OF = { 'M-01': 'C-01', 'M-02': 'C-06', 'M-03': 'C-07', 'M-04': 'C-08', 'M-05': 'C-09', 'M-06': 'C-02', 'M-07': 'C-10', 'M-08': 'C-11', 'M-09': 'C-12', 'M-10': 'C-13' };

  E.fundamental = function (cid, day) {
    const c = CROP_OF[cid];
    const base = CONT[cid].p0;
    if (!c) return base;
    const crop = CROP[c];
    return base * (crop.seasons.includes(E.season(day)) ? T.cropSeasonMult : T.cropOffSeasonMult);
  };

  function markPrices() {
    const S = E.S;
    D.CONTRACTS.forEach(c => {
      S.prev[c.id] = S.prices[c.id];
      const shock = (S.shocks || []).filter(x => x.id === c.id && x.until >= S.day).reduce((a, x) => a + x.pct, 0);
      const pull = T.marketPull * (E.fundamental(c.id, S.day) / S.prices[c.id] - 1);
      const chg = clamp(randn() * c.sig + shock + pull, -0.12, 0.12);
      S.prices[c.id] = Math.max(1, r3(S.prices[c.id] * (1 + chg)));
    });
    // 大盘通胀：个股走势不变，整体按 1%~4% 的日涨幅统一缩放
    const ratios = D.CONTRACTS.map(c => S.prices[c.id] / S.prev[c.id]);
    const avg = ratios.reduce((a, v) => a + v, 0) / Math.max(1, ratios.length);
    const target = 1 + T.marketIndexBase + Math.random() * T.marketIndexRand;
    if (avg > 0) {
      const scale = target / avg;
      D.CONTRACTS.forEach(c => {
        S.prices[c.id] = Math.max(1, r3(S.prices[c.id] * scale));
      });
    }
    S.shocks = (S.shocks || []).filter(x => x.until >= S.day);
    maybeNews();
    if (S.forecast && S.forecast.day === S.day) {
      const f = S.forecast, prev = S.prev[f.cid] || S.prices[f.cid];
      let price = S.prices[f.cid];
      if (f.dir > 0 && price <= prev) price = r3(prev + Math.max(0.001, prev * 0.002));
      if (f.dir < 0 && price >= prev) price = r3(Math.max(1, prev - Math.max(0.001, prev * 0.002)));
      S.prices[f.cid] = Math.max(1, price);
      S.forecast = null;
    }
    if (E.countInv('J-33')) {
      S.positions.forEach(p => {
        if (p.liq == null) return;
        const price = S.prices[p.cid];
        if (!price) return;
        const gap = p.dir > 0 ? (price - p.liq) / price : (p.liq - price) / price;
        if (gap <= 0.03) {
          if (!p.stopAlerted) {
            log('止损铃响了：' + CONT[p.cid].n + '离强平只剩 ' + (Math.max(0, gap) * 100).toFixed(1) + '%。', 'warn');
            p.stopAlerted = true;
          }
        } else if (gap > 0.06) p.stopAlerted = false;
      });
    }
    settlePositions();
  }
  E.markPrices = markPrices;

  function maybeNews() {
    const S = E.S;
    if (Math.random() < 0.35) {
      const e = pick(D.EVENTS);
      S.news = e;
      S.shocks.push({ id: e.target, pct: e.pct, until: S.day + e.days });
      if (e.second) S.shocks.push({ id: e.second, pct: e.secondPct, until: S.day + e.days });
      log('快讯：' + e.n + '，' + CONT[e.target].n + ' ' + (e.pct > 0 ? '+' : '') + Math.round(e.pct * 100) + '%。', 'info');
    } else S.news = null;
  }

  function liqPrice(p) {
    const S = E.S, m = E.mod();
    if (p.lev <= 1) return null;
    const drop = (1 / p.lev) * (1 - S.diff.keep) * m.liqBuffer;
    return p.dir > 0 ? p.entry * (1 - drop) : p.entry * (1 + drop);
  }
  E.liqPrice = liqPrice;

  function settlePositions() {
    const S = E.S;
    S.positions.slice().forEach(p => {
      const price = S.prices[p.cid], liq = p.liq;
      if (liq == null) return;
      const hit = p.dir > 0 ? price <= liq : price >= liq;
      if (!hit) return;
      let back = 0;
      let saved = false;
      if (S.flag.ledgerArmed && E.countAll('I-01') > 0) {
        E.consumeAll('I-01', 1);
        S.flag.ledgerArmed = false;
        back = p.margin;
        saved = true;
        addMail('-', '里面夹着￥' + money(p.margin) + '和一句话：你满意了吧？', 'blank');
      } else if (p.intel && S.day === p.intelDay + 1) {
        const exit = liq;
        const pnl = (exit - p.entry) * p.qty * p.dir;
        S.money += p.margin + pnl;
        if (pnl > 0) S.realized += pnl;
        S.positions = S.positions.filter(x => x !== p);
        log('呼，还好提前跑了……', 'warn');
        if (pnl < 0) {
          const loss = Math.round(-pnl);
          S.money += loss;
          addMail('-', '里面夹着￥' + money(loss) + '和一句话：抱歉，这周可能要失联了', 'blank');
        }
        return;
      } else {
        if (S.flag.insurance) { back = Math.round(p.margin * 0.1); S.flag.insurance = false; }
        if (E.hasTalent('TL-33')) back += Math.round(p.margin * 0.2);
        if (back > 0) addMail('尊敬的' + (S.playerName || '客户'), '您的保险金￥' + money(back) + '已到账', 'insurance');
      }
      S.money += back;
      S.realized -= p.margin - back;
      S.positions = S.positions.filter(x => x !== p);
      log('强平：' + CONT[p.cid].n + ' ' + (p.dir > 0 ? '多' : '空') + ' ' + p.lev + '×，价格 ' + p3(price) + ' 触及 ' + p3(liq) + (saved ? '，旧账本抵了这一下。' : back > 0 ? '，保险金会寄到。' : '，本金清零。'), (saved || back > 0) ? 'warn' : 'bad');
    });
    S.flag.ledgerArmed = false;
    checkEnd();
  }

  E.addMargin = function (pid, amt) {
    const S = E.S;
    const p = S.positions.find(x => x.pid === pid);
    if (!p) return;
    amt = Math.min(amt, S.money);
    if (amt < 100) { log('至少加 100 元。', 'warn'); return; }
    S.money -= amt;
    p.margin += amt;
    p.lev = Math.max(1, Math.round(p.qty * p.entry / p.margin * 10) / 10);
    p.liq = liqPrice(p);
    log('给' + CONT[p.cid].n + '追加保证金 ' + money(amt) + '，强平线推到 ' + (p.liq ? p3(p.liq) : '不设') + '。', 'good');
  };

  E.openPosition = function (cid, dir, margin, lev) {
    const S = E.S;
    if (S.detained > 0 || S.hospital) { log('现在动不了。', 'warn'); return; }
    if (S.positions.length >= 5) { log('持仓最多 5 笔。', 'warn'); return; }
    if (margin < S.diff.minOpen) { log('最小开仓 ' + money(S.diff.minOpen) + ' 元。', 'warn'); return; }
    if (lev < 1 || lev > 100) { log('杠杆 1–100。', 'warn'); return; }
    if (margin > S.money) { log('现金不够。', 'warn'); return; }
    const fee = Math.max(0, Math.round(margin * lev * E.mod().fee));
    if (margin + fee > S.money) { log('现金不够付手续费。', 'warn'); return; }
    const price = S.prices[cid];
    const p = { pid: ++S.opened, cid, dir, margin, lev, entry: price, qty: margin * lev / price, liq: null };
    if (E.hasTalent('TL-26') && S.intelWeek !== S.week && margin * lev <= 100000) {
      p.intel = true; p.intelDay = S.day; S.intelWeek = S.week;
      log('这一单本周先盯着，真要爆了就跑。', 'info');
    }
    p.liq = liqPrice(p);
    S.money -= margin + fee;
    if (S.flag.marginDiscount) {
      const disc = Math.round(margin * 0.1);
      S.money += disc;
      S.flag.marginDiscount = false;
      log('那张旧凭条抵了 ' + money(disc) + ' 元保证金。', 'good');
    }
    S.positions.push(p);
    E.addXp('A-04', 4);
    log((dir > 0 ? '做多' : '做空') + CONT[cid].n + ' ' + lev + '×，保证金 ' + money(margin) + '，手续费 ' + money(fee) + '，开仓 ' + p3(price) + (p.liq ? '，强平线 ' + p3(p.liq) : '，永不爆仓') + '，余现金 ' + money(S.money) + '。', 'info');
    checkEnd();
  };

  E.closePosition = function (pid) {
    const S = E.S;
    const p = S.positions.find(x => x.pid === pid);
    if (!p) return;
    const price = S.prices[p.cid];
    const pnl = (price - p.entry) * p.qty * p.dir;
    const fee = Math.round(Math.abs(price * p.qty) * E.mod().fee);
    let comp = 0;
    if (p.intel && S.day === p.intelDay && pnl < 0) comp = -pnl;
    S.money += p.margin + pnl + comp - fee;
    S.realized += pnl + comp - fee;
    S.positions = S.positions.filter(x => x !== p);
    E.addXp('A-04', 4);
    const net = pnl + comp - fee;
    log('平掉' + CONT[p.cid].n + '，价格 ' + p3(price) + '，盘面 ' + (pnl >= 0 ? '+' : '') + money(pnl) + '，手续费 ' + money(fee) + '，净 ' + (net >= 0 ? '+' : '') + money(net) + '。', net >= 0 ? 'good' : 'bad');
    if (comp > 0) addMail('-', '里面夹着￥' + money(comp) + '和一句话：抱歉，这周可能要失联了', 'blank');
    checkEnd();
  };

  E.payoff = function () {
    const S = E.S;
    if (S.money < S.totalDebt) { log('还差 ' + money(S.totalDebt - S.money) + ' 元。', 'warn'); return; }
    S.money -= S.totalDebt;
    S.paid += S.totalDebt;
    S.totalDebt = 0;
    log('把剩下的债一次还清。柜台后的人点了三遍钱，没抬头。', 'good');
    E.finishAuto();
  };

  E.settleD = function () {
    const S = E.S;
    const cost = Math.round(S.totalDebt * 0.6);
    if (S.money < cost) { log('和解要 ' + money(cost) + ' 元，拿不出。', 'warn'); return; }
    S.money -= cost;
    S.totalDebt = 0;
    E.finish('D');
  };

  /* ---------------- 农场 ---------------- */
  E.seedCost = function (cid) {
    const base = Math.max(1, Math.round(CROP[cid].price * 0.12));
    return E.hasTalent('TL-05') ? Math.max(1, Math.round(base * 0.8)) : base;
  };
  E.cropWater = c => c.days;
  E.cropYield = c => c.days;
  E.cropUnit = c => Math.max(1, Math.round(c.price * T.cropPriceMult * T.cropValueFactor / c.days));
  E.cropQuality = id => (E.S.q && E.S.q[id]) || 1;

  E.plotState = function (i) {
    const S = E.S, p = S.plots[i];
    if (!p.crop) return { empty: true, fert: p.fert };
    const crop = CROP[p.crop];
    const left = Math.max(0, p.planted + p.days - S.day);
    return { empty: false, crop, left, fert: p.fert, mature: left <= 0 };
  };

  function farmGuard() {
    const S = E.S;
    if (S.detained > 0 || S.hospital) { log('现在动不了。', 'warn'); return false; }
    if (!E.hasTalent('TL-30') && (S.dayMode === 'raid' || S.raid)) { log('今天已经出过门了，明天再下地。', 'warn'); return false; }
    S.dayMode = 'farm';
    return true;
  }

  E.plant = function (i, cid) {
    const S = E.S, crop = CROP[cid];
    if (!crop || crop.wild) return;
    if (!farmGuard()) return;
    const p = S.plots[i];
    if (!p || p.crop) { log('这块田里还有东西。', 'warn'); return; }
    const cost = E.seedCost(cid);
    if (S.money < cost) { log('买不起种子（' + cost + ' 元）。', 'warn'); return; }
    S.money -= cost;
    p.crop = cid; p.planted = S.day; p.days = Math.max(1, crop.days + E.mod().growth);
    p.watered = 0; p.stress = 0; p.lastWater = -1;
    E.useStamina(8);
    E.addXp('A-01', 1);
    log('在 ' + (i + 1) + ' 号田播下' + crop.n + '，' + p.days + ' 天后可收。');
  };

  E.harvest = function (i) {
    const S = E.S, p = S.plots[i];
    if (!p.crop) return;
    if (!farmGuard()) return;
    const st = E.plotState(i);
    if (!st.mature) { log('还没熟，剩 ' + st.left + ' 天。', 'warn'); return; }
    const crop = CROP[p.crop];
    const inSeason = crop.seasons.includes(E.season());
    const base = p.days + (E.hasTalent('TL-28') ? 1 : 0);
    const need = p.days;
    const missed = need > 0 ? Math.max(0, need - (p.watered || 0)) : 0;
    const stress = p.stress || 0;
    const m = E.mod();
    const seasonal = inSeason ? 1 : m.offSeason;
    const rawQty = Math.max(0, (base - missed - stress + (E.hasTalent('TL-28') ? 1 : 0)) * m.yield * seasonal);
    const qty = Math.floor(rawQty) + (Math.random() < rawQty - Math.floor(rawQty) ? 1 : 0);
    const q = Math.min(1, (stress ? Math.max(0.5, 1 - 0.06 * stress) : 1) + (E.hasTalent('TL-31') ? 0.15 : 0));
    /* 收成直接入库，不经过背包 */
    if (qty > 0) {
      const prevN = S.store[p.crop] || 0;
      const prevQ = E.cropQuality(p.crop);
      S.store[p.crop] = prevN + qty;
      S.q[p.crop] = Math.max(0.4, (prevQ * prevN + q * qty) / Math.max(1, prevN + qty));
    }
    const got = qty;
    p.crop = null; p.planted = 0; p.days = 0; p.watered = 0; p.stress = 0;
    E.useStamina(6);
    E.addXp('A-01', 3);
    const look = q < 0.9 ? '，卖相差' : q < 1 ? '，卖相一般' : '';
    const tail = look + (E.storeOver() ? '，仓库已经放不下' : '');
    if (qty > 0) log('收了 ' + (i + 1) + ' 号田的' + crop.n + '×' + got + '，直接入库' + tail + '。', 'good');
    else log((i + 1) + ' 号田的' + crop.n + '什么也没收上来' + (E.storeOver() ? '，仓库已经放不下' : '') + '。', 'bad');
  };

  /* 检查：花 1 点体力，只看个大概，不给数字 */
  E.inspectPlot = function (i) {
    const S = E.S, p = S.plots[i];
    if (!p) return;
    if (!E.hasTalent('TL-04')) {
      if (!farmGuard()) return;
      E.useStamina(1);
    }
    if (!p.crop) {
      log((i + 1) + ' 号田空着，' + (p.fert >= 35 ? '随时能种。' : '地有点瘦，种之前该施点肥。'));
      return;
    }
    const crop = CROP[p.crop];
    const left = Math.max(0, p.planted + p.days - S.day);
    const need = p.days, got = p.watered || 0;
    const stress = p.stress || 0;
    let plantWord;
    if (stress >= 3) plantWord = '快枯萎了，该施肥了';
    else if (p.fert >= 60) plantWord = '长势很好';
    else if (p.fert >= 35) plantWord = '长势还行';
    else plantWord = '叶子有点发黄，该施肥了';
    const waterWord = got >= need ? '不需要浇水了' : (need - got) >= 2 ? '该浇水了' : '应该再浇一次就够了';
    const head = (i + 1) + ' 号田的' + crop.n + (left <= 0 ? '能收了' : '还剩 ' + left + ' 天');
    log(head + '。' + plantWord + '，' + waterWord + '。', (p.fert < 35 || got < need) ? 'warn' : '');
  };

  E.water = function (i) {
    const S = E.S, p = S.plots[i];
    if (!farmGuard()) return;
    if (p.crop && (p.watered || 0) >= p.days) {
      log('这块田已经喝饱了，不用再浇。', 'warn');
      return;
    }
    p.fert = clamp(p.fert + 4, 0, 100);
    if (p.crop) p.watered = (p.watered || 0) + 1;
    if (!E.hasTalent('TL-27')) E.useStamina(S.fac['U-03'] ? 2 : 4);
    log('给 ' + (i + 1) + ' 号田浇了水。');
  };

  E.fertilize = function (i, kind) {
    const S = E.S, p = S.plots[i];
    if (!farmGuard()) return;
    if (kind === 'shop') {
      if (S.money < 60) { log('商业肥料 60 元，买不起。', 'warn'); return; }
      S.money -= 60;
      p.fert = clamp(p.fert + 30, 0, 100);
      E.useStamina(3);
      log('施了商业肥料，' + (i + 1) + ' 号田的土松了些。');
    } else if (kind === 'guano') {
      if (!E.takeInv('G-32', 1)) { log('没有鸟粪。', 'warn'); return; }
      p.fert = clamp(p.fert + 25, 0, 100);
      E.useStamina(3);
      S.san = Math.max(0, S.san - 4);
      log('撒了鸟粪，' + (i + 1) + ' 号田的土松了些，味道冲得人发晕。', 'warn');
    }
  };

  E.startFarm = function () {
    const S = E.S;
    if (!E.hasTalent('TL-30') && (S.raid || S.dayMode === 'raid')) { log('今天已经出过门了。', 'warn'); return; }
    if (S.detained > 0 || S.hospital) { log('现在动不了。', 'warn'); return; }
    S.dayMode = 'farm';
    log('今天下地。体力用完前可以一直干。');
  };

  /* ---------------- 搜刮 ---------------- */
  E.mapReady = function (mapId) {
    const map = MAPD[mapId];
    const S = E.S;
    if (!map) return '没有这张图。';
    if (map.req && !E.countInv(map.req)) return '进' + map.n + '需要' + E.nameOf(map.req) + '（' + map.hint + '）。';
    if (S.stamina < map.stam * 2) return '体力不够走这一趟。';
    return null;
  };

  E.startRaid = function (mapId) {
    const S = E.S;
    if (S.raid) return;
    if (S.detained > 0 || S.hospital) { log('现在动不了。', 'warn'); return; }
    if (!E.hasTalent('TL-30') && S.dayMode === 'farm') { log('今天已经下地了，明天再出门。', 'warn'); return; }
    const map = MAPD[mapId];
    if (!map) return;
    /* 门槛道具在仓库里就自动带上 */
    if (map.req && !E.countInv(map.req) && (S.store[map.req] || 0) > 0) {
      if (E.slotsUsed() + E.sz(map.req) > E.mod().bag) {
        log('东西带太多了，拿不了' + E.nameOf(map.req) + '。', 'warn');
        return;
      }
      E.transfer(map.req, 1, false);
      if (E.countInv(map.req)) log('从仓库取了' + E.nameOf(map.req) + '带上。');
    }
    const err = E.mapReady(mapId);
    if (err) { log(err, 'warn'); return; }
    S.raid = { mapId, node: 1, nodes: map.nodes, searched: 0, taken: [] };
    S.dayMode = 'raid';
    log('出发去' + map.n + '。离回家还有一些距离。', 'info');
    if (mapId === 'D-07') E.sellDockHotOnArrival();
  };

  E.sellDockHotOnArrival = function () {
    const S = E.S;
    let total = 0, n = 0;
    Object.keys(S.hot || {}).forEach(id => {
      const h = S.hot[id] || 0;
      if (!h) return;
      const unit = Math.round(E.valueOf(id) * E.mod().sell * E.hotRate());
      total += unit * h;
      n += h;
      E.takeHot(id, h);
      if (id[0] === 'C' && !(S.inv[id] || S.store[id]) && S.q) delete S.q[id];
    });
    if (n) {
      S.money += total;
      log('混进码头了，先把包里东西卖了……（+' + money(total) + ' 元）', 'good');
    }
  };

  function rollQuality(pool, special) {
    const weights = pool.map(q => special ? (Q[q] ? Q[q].sp : 0) : (Q[q] ? Q[q].w : 0));
    let sum = weights.reduce((a, b) => a + b, 0);
    if (sum <= 0) return pool[0];
    let r = Math.random() * sum;
    for (let i = 0; i < pool.length; i++) {
      r -= weights[i];
      if (r <= 0) return pool[i];
    }
    return pool[pool.length - 1];
  }

  function rollMat(map, pool, special) {
    const q = rollQuality(pool, special);
    if (q === 4) {
      const items = D.ITEMS.filter(i => i.use);
      return { kind: 'item', q: 4, id: pick(items).id };
    }
    let cands = D.MATS.filter(m => m.q === q && (special || m.maps.includes(map.n)));
    if (!cands.length) cands = D.MATS.filter(m => m.q === q);
    if (!cands.length) cands = D.MATS.filter(m => m.q === 1);
    const sum = cands.reduce((a, m) => a + m.w, 0);
    let r = Math.random() * sum;
    for (const m of cands) { r -= m.w; if (r <= 0) return { kind: 'mat', q, id: m.id }; }
    return { kind: 'mat', q, id: cands[cands.length - 1].id };
  }

  E.sanDeltaFor = function (q) { return SAN_Q[q] || 0; };

  E.doSearch = function (opts) {
    const S = E.S;
    const special = !!opts.special;
    const map = opts.map;
    const m = E.mod();
    if (E.slotsUsed() >= m.bag) return { ok: false, msg: '包塞满了，该回去了……' };
    const container = opts.container || pick(D.CONTAINERS.filter(c => c.id !== 'K-09' && c.id !== 'K-08'));
    let lockBroke = false;
    const needLock = !!container.locked;
    const crow = m.crowbar && !special;
    if (needLock && !crow && !m.lockpick) return { ok: false, msg: '是个' + container.n + '，锁着；得拿开锁器或撬棍来。' };
    let stam = Math.max(2, map.stam + m.searchStam + (special ? 2 : 0));
    if (crow) stam = Math.max(1, Math.round(stam * T.crowbarStamMult));
    if (S.stamina < stam) return { ok: false, msg: '没力气翻东西了。' };
    if (crow) {
      S.crowUses = (S.crowUses || 0) + 1;
      const hurtChance = S.crowUses <= T.crowbarSafe ? 0 : Math.min(1, T.crowbarBase + T.crowbarStep * (S.crowUses - T.crowbarSafe - 1));
      if (Math.random() < hurtChance) {
        S.crowUses = 0;
        const hurt = T.crowbarHurtMin + Math.floor(Math.random() * (T.crowbarHurtMax - T.crowbarHurtMin + 1));
        E.useStamina(hurt);
        if (opts.raid && !S.raid) return { ok: true, msg: '' };
        return { ok: false, msg: '撬棍一滑，弄到手了，好痛。' + container.n + '也卡死了，得小心点。' };
      }
    }
    if (stam) E.useStamina(stam);
    if (opts.raid && !S.raid) return { ok: true, msg: '' };
    if (needLock && !crow) {
      S.lockUses = (S.lockUses || 0) + 1;
      if (S.lockUses >= T.lockpickSafe + 1) {
        const breakChance = Math.min(1, T.lockpickBase + T.lockpickStep * (S.lockUses - T.lockpickSafe - 1));
        if (Math.random() < breakChance) {
          if (E.takeInv('J-23', 1)) { S.lockUses = 0; lockBroke = true; }
        }
      }
    }
    if (S.stamina <= 0) return { ok: false, msg: '体力见底，眼前一黑。' };
    const baseSan = 0;
    const sanCost = Math.round(baseSan * m.sanLoss * (S.flag.sanShield ? 0 : 1));
    S.san = clamp(S.san - sanCost, 0, S.sanMax);
    if (opts.raid) opts.raid.searched++;

    if (S.san <= 0) {
      return { ok: true, msg: '感觉有点难过，不想继续捡了。', sanCost };
    }

    let n = 2 + (Math.random() < 0.3 ? 1 : 0);
    if (E.hasTalent('TL-14') && Math.random() < 0.3) n++;
    const got = [];
    let hotPick = false;
    for (let i = 0; i < n; i++) {
      const drop = rollMat(map, container.pool || [1, 2], special);
      let q = drop.q;
      if (E.hasTalent('TL-29') && Math.random() < 0.35) q = Math.min(5, q + 1);
      if (S.san <= 0) break;
      const hot = !special && (map.presence === true);
      const add = E.addInv(drop.id, 1, { hot, silent: true });
      if (!add) { got.push('（背包满了）'); break; }
      if (hot) hotPick = true;
      if (opts.raid) opts.raid.taken.push({ id: drop.id, hot });
      const d = E.sanDeltaFor(q) * (q < 4 ? m.sanLoss : 1) * (S.flag.sanShield ? 0 : 1);
      S.san = clamp(S.san + d, 0, S.sanMax);
      const san = d ? '（' + (d > 0 ? '+' : '') + f1(d) + ' SAN）' : '';
      got.push('<span class="loot lq' + q + '">' + E.nameOf(drop.id) + '</span>' + san);
    }
    if (hotPick) S.stolen++;
    E.addXp('A-05', 2);

    /* 小概率摸到关键道具（关键道具不算赃物） */
    if (Math.random() < 0.06) {
      const k = pick(D.KEYITEMS);
      if (E.addInv(k.id, 1, { silent: true })) {
        if (opts.raid) opts.raid.taken.push({ id: k.id, hot: false });
        got.push('<span class="loot lq4">' + k.n + '</span>');
      }
    }
    return {
      ok: true, sanCost, broke: lockBroke,
      msg: (got.length ? '在' + container.n + '里摸到：' + got.join('、') : container.n + '里什么都没有') + (S.san <= 0 ? ' 感觉有点难过，不想继续捡了。' : '')
    };
  };

  E.searchContainer = function () {
    const S = E.S, r = S.raid;
    if (!r) return;
    const map = MAPD[r.mapId];
    if (!map) { S.raid = null; S.dayMode = null; log('这条路对不上号了，人退回了镇口。', 'warn'); return; }
    const res = E.doSearch({ map, raid: r });
    if (res.msg) log(res.msg + (res.sanCost ? '（SAN −' + res.sanCost + '）' : ''), res.ok ? '' : 'warn');
    if (res.broke) log('开锁器卡死了，只好扔掉。', 'warn');
    if (!S.raid) return;
    if (map.presence) S.presence = clamp(S.presence + Math.round((T.searchPresenceMin + R(T.searchPresenceRange)) * E.mod().presenceGain), 0, 100);
    if (S.presence >= 100) E.arrest('存在感满了。柯恩把我带走。');
  };

  E.advance = function () {
    const S = E.S, r = S.raid;
    if (!r) return;
    if (!MAPD[r.mapId]) { S.raid = null; S.dayMode = null; log('这条路对不上号了，人退回了镇口。', 'warn'); return; }
    if (r.node >= r.nodes) { log('已经走到底了，可以回去了。', 'warn'); return; }
    E.useStamina(MAPD[r.mapId].stam);
    if (!S.raid) return;
    r.node++;
    log('往里走了一段。');
  };

  E.extract = function () {
    const S = E.S, r = S.raid;
    if (!r) return;
    if (!MAPD[r.mapId]) { S.raid = null; S.dayMode = null; log('这条路对不上号了，人退回了镇口。', 'warn'); return; }
    if (!E.hasTalent('TL-22') && r.node < r.nodes) { log('还没走到底，回不去。', 'warn'); return; }
    const map = MAPD[r.mapId];
    let chance = 1;
    if (map.presence) {
      if (S.presence >= 80) chance = 0.35;
      else if (S.presence >= 50) chance = 0.7;
    }
    if (S.flag.extract) { chance = 1; S.flag.extract = false; }
    const searched = r.searched;
    S.raid = null;
    S.flag.sanShield = false;
    if (Math.random() <= chance) {
      log('回家了。这趟翻了 ' + searched + ' 个容器。', 'good');
      E.autoStore();
    } else {
      S.presence = clamp(S.presence + 10, 0, 100);

  E.arrest = function (reason) {

    if (E.hasTalent('TL-25')) days = Math.max(1, days - 1);
    S.detained = days;
    S.presence = 0;
    S.raid = null;
    S.dayMode = null;
    S.hospital = null;
    S.flag.sanShield = false;
    let seized = 0;
    Object.keys(S.inv).forEach(id => {
      if (ITEM[id]) { seized += S.inv[id]; delete S.inv[id]; delete S.hot[id]; }
    });

  };

  /* ---------------- 医院 ---------------- */
  /* 住院当天可以搜病床柜与档案柜；结算在 endDay 里 */

    if (S.hospital.rest) { log('值班医生盯着呢，今天只能躺着。', 'warn'); return; }
    const map = MAPD['D-03'];
    const res = E.doSearch({ map, special: true, container: pick(D.CONTAINERS.filter(c => c.id === 'K-08' || c.id === 'K-06')) });
    if (!res.ok) { log(res.msg, 'warn'); return; }
    log(res.msg, 'good');
    S.presence = clamp(S.presence + Math.round((4 + R(5)) * E.mod().presenceGain), 0, 100);
    if (S.presence >= 100) { E.arrest('在诊所翻得太久，被护士叫了人。'); return; }
    if (S.stamina < 50 && !S.hospital.rest) {

  /* ---------------- 售卖 ---------------- */

    let total = 0, n = 0;
    Object.keys(S.hot || {}).forEach(id => {

      if (!h || (id[0] !== 'C' && id[0] !== 'G')) return;
      const unit = Math.round(E.valueOf(id) * E.mod().sell * E.hotRate());

      total += unit * h;
      n += h;
      S.store[id] -= h;

  E.sellLegal = function (id, qty) {

    S.money += total;
    if (n) log('在码头出掉 ' + n + ' 件货，现款 ' + money(total) + ' 元。', 'good');

  /* ---------------- 存档 ---------------- */
  const SAVE_VER = 3;

  function normalize(s) {
    s.inv = s.inv || {};
    s.hot = s.hot || {};
    s.storeHot = s.storeHot || {};
    s.store = s.store || {};
    Object.keys(s.hot).forEach(id => { if (id[0] !== 'C' && id[0] !== 'G') delete s.hot[id]; });
    Object.keys(s.storeHot).forEach(id => {
      if (id[0] !== 'C' && id[0] !== 'G') { delete s.storeHot[id]; return; }
      const st = s.store[id] || 0;
      if (!st) delete s.storeHot[id];
      else if (s.storeHot[id] > st) s.storeHot[id] = st;
    });
    s.storeLv = s.storeLv || 1;
    s.storeUp = s.storeUp || null;
    s.fac = s.fac || {};
    s.skills = s.skills || {};
    s.xp = s.xp || {};
    (D.SKILLS || []).forEach(k => {
      if (typeof s.skills[k.id] !== 'number') s.skills[k.id] = 0;
      if (typeof s.xp[k.id] !== 'number') s.xp[k.id] = 0;
    });
    if (!Array.isArray(s.presets) || !s.presets.length) {
      s.presets = (D.PRESETS || []).map(p => Object.assign({ system: true }, p));
    }
    if (!Array.isArray(s.sms)) s.sms = [];
    if (!Array.isArray(s.mail)) s.mail = [];
    if (!Array.isArray(s.log)) s.log = [];
    if (!Array.isArray(s.positions)) s.positions = [];
    if (!Array.isArray(s.plots) || !s.plots.length) {
      s.plots = [0, 1, 2, 3].map(() => ({ crop: null, planted: 0, days: 0, fert: 100 }));
    }
    s.plots.forEach(p => {
      if (typeof p.fert !== 'number') p.fert = 100;
      if (typeof p.days !== 'number') p.days = 0;
      if (typeof p.planted !== 'number') p.planted = 0;
      if (typeof p.watered !== 'number') p.watered = 0;
      if (typeof p.stress !== 'number') p.stress = 0;
      if (typeof p.lastWater !== 'number') p.lastWater = -1;
    });
    s.q = s.q || {};
    s.flag = s.flag || {};
    s.shocks = s.shocks || [];
    if (typeof s.week !== 'number') s.week = 1;
    if (typeof s.dueIn !== 'number') s.dueIn = 7;
    if (typeof s.deferAt !== 'number') s.deferAt = 0;
    if (typeof s.deferOnce !== 'boolean') s.deferOnce = false;
    if (typeof s.cutDebt !== 'number') s.cutDebt = 0;
    if (typeof s.opened !== 'number') s.opened = 0;
    s.playerName = s.playerName || '无名';
    if (typeof s.generation !== 'number') s.generation = 1;
    if (typeof s.stolen !== 'number') s.stolen = 0;
    if (typeof s.deliveredCount !== 'number') s.deliveredCount = 0;
    if (typeof s.dueIn !== 'number') s.dueIn = 7;
    if (typeof s.lastExempt !== 'boolean') s.lastExempt = false;
    if (typeof s.overGrace !== 'boolean') s.overGrace = false;
    if (typeof s.presence !== 'number') s.presence = 0;
    if (typeof s.san !== 'number') s.san = 100;
    if (typeof s.stamina !== 'number') s.stamina = 100;
    if (typeof s.staminaMax !== 'number') s.staminaMax = 100;
    if (s.hospital && typeof s.hospital.stage !== 'number') {
      s.hospital = { stage: 2, fee: s.hospital.fee || 60, left: 2 };
    }
    if (s.hospital && typeof s.hospital.left !== 'number') s.hospital.left = 2;
    if (typeof s.sanMax !== 'number') s.sanMax = 100;
    const DIFF_ALIAS = { easy: 'ideal', normal: 'real', hell: 'hard' };
    if (DIFF_ALIAS[s.diffKey]) s.diffKey = DIFF_ALIAS[s.diffKey];
    if (!s.diffKey || !D.DIFFS[s.diffKey]) s.diffKey = 'real';
    s.diff = D.DIFFS[s.diffKey];
    if (typeof s.due !== 'number') {
      const t = s.diff.dues;
      s.due = t[Math.min(t.length - 1, Math.max(0, (s.week || 1) - 1))];
    }
    if (typeof s.money !== 'number') s.money = 200;
    if (typeof s.maxCash !== 'number') s.maxCash = s.money;
    s.maxCash = Math.max(s.maxCash, s.money);
    if (typeof s.hiRecorded !== 'boolean') s.hiRecorded = false;
    if (typeof s.totalDebt !== 'number') s.totalDebt = s.diff.dues.reduce((a, b) => a + b, 0);
    if (typeof s.debt0 !== 'number' || !s.debt0) s.debt0 = s.totalDebt;
    if (!s.prices || !Object.keys(s.prices).length) {
      s.prices = {}; s.prev = {};
      D.CONTRACTS.forEach(c => { s.prices[c.id] = c.p0; s.prev[c.id] = c.p0; });
    }
    s.prev = s.prev || {};
    D.CONTRACTS.forEach(c => {
      if (typeof s.prices[c.id] !== 'number') s.prices[c.id] = c.p0;
      if (typeof s.prev[c.id] !== 'number') s.prev[c.id] = s.prices[c.id];
    });
    s.ver = SAVE_VER;
    s.talents = (Array.isArray(s.talents) ? s.talents : [])
      .map(id => String(id).replace(/^(T|P)-/, 'TL-'))
      .filter(id => D.TALENTS.some(t => t.id === id));
    if (typeof s.intelWeek !== 'number') s.intelWeek = 0;
    if (typeof s.lockUses !== 'number') s.lockUses = 0;
    if (typeof s.crowUses !== 'number') s.crowUses = 0;
    if (s.raid && !D.MAPS.some(m => m.id === s.raid.mapId)) {
      s.raid = null; s.dayMode = null;
    }
    return s;
  }
